<!DOCTYPE html>
<html lang="de">

<title>Mathe-Übungstool</title>
<style>

  .ka-head { font-weight: 900; font-size: 1.08rem; margin-bottom: 2px; }

  .erkl-kopf { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

  .choice-btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
  button.choice-btn {
    font: inherit; font-weight: 800; font-size: 1.1rem;

  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  button.btn {
    font: inherit; font-weight: 700; font-size: 0.95rem;
    padding: 12px 18px; border-radius: 10px; border: none;
    cursor: pointer; color: white; background: var(--accent);
  }

  button.btn.secondary {

  .steps-box {

<body>
<div id="app"></div>

<script>



// ============================================================
// logic.js -- Reine Rechenlogik für das Mathe-Übungstool.
// (1:1 identisch zur separat mit 16000 Testaufgaben geprüften Version --
// siehe Testprotokoll in der Projekt-Antwort.)
// ============================================================
(function (root) {
  "use strict";

  // ---------- Hilfsfunktionen ----------
  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }
  function choice(arr) {
    return arr[randInt(0, arr.length - 1)];
  }
  function round2(x) {
    return Math.round(x * 100) / 100;
  }
  function round4(x) {
    return Math.round(x * 10000) / 10000;
  }
  function fmtNum(x) {
    return String(x).replace(".", ",");
  }
  function gcd(a, b) {
    a = Math.abs(a); b = Math.abs(b);
    while (b) { [a, b] = [b, a % b]; }
    return a;
  }
  function parseUserNumber(str) {
    if (typeof str !== "string") return NaN;
    const cleaned = str.trim().replace(/\s+/g, "").replace(",", ".");
    if (cleaned === "" || cleaned === "-" ) return NaN;
    if (!/^-?\d+(\.\d+)?$/.test(cleaned)) return NaN;
    return parseFloat(cleaned);
  }
  function parseUserFraction(str) {
    if (typeof str !== "string") return null;
    const cleaned = str.trim().replace(/\s+/g, "");
    if (cleaned === "") return null;
    const m = cleaned.match(/^(-?\d+)\/(-?\d+)$/);
    if (m) {
      const num = parseInt(m[1], 10);
      const den = parseInt(m[2], 10);
      if (den === 0) return null;
      return { num, den };
    }
    const n = parseUserNumber(cleaned);
    if (!isNaN(n)) return { num: n, den: 1 };
    return null;
  }
  function fractionsEqual(f1, f2, tol) {
    tol = tol || 1e-9;
    return Math.abs(f1.num * f2.den - f2.num * f1.den) < tol * Math.max(1, Math.abs(f1.den * f2.den));
  }
  function numbersClose(a, b, tol) {
    tol = tol === undefined ? 0.05 : tol;
    return Math.abs(a - b) <= tol;
  }
  // Basis für die Anzeige direkt vor einem Exponenten: negative Zahlen IMMER
  // in Klammern setzen, sonst wäre "-9^2" mathematisch mehrdeutig
  // (Konvention: -9^2 = -(9^2) = -81, aber gemeint ist (-9)^2 = 81).
  function baseStr(a) {
    return a < 0 ? `(${a})` : `${a}`;
  }
  // Koeffizient vor einer Variable konventionell darstellen: "1x" -> "x",
  // "-1x" -> "-x", sonst normale Zahl davor.
  function coefX(m, varName) {
    varName = varName || "x";
    if (m === 1) return varName;
    if (m === -1) return "-" + varName;
    return `${m}${varName}`;
  }
  // Rechenweg beginnt mit der Aufgabe in genau der gegebenen Form (danach erst Ablesen/Umformen)
  function mitAusgang(stepsFn) { const f = (task) => [{ left: task.prompt, right: "" }].concat(stepsFn(task)); f.mitAusgang = true; return f; }
  // Abschnitte für die Tipp-Funktion (eine Quelle für App UND Tests):
  //  1. Gliederung nach Überschriften (label); eine vorangestellte Aufgabe gehört zum ersten Abschnitt.
  //  2. Ergibt das weniger als zwei Abschnitte: Schritt für Schritt (Hinweis, Zwischenschritte …).
  //  3. Ein Schlussabschnitt ohne Rechenzeile wird angehängt – das Ergebnis bleibt immer dem
  //     letzten Abschnitt vorbehalten (= erst mit „Rechenweg zeigen“ sichtbar).
  function tippAbschnitte(task, alle) {
    const istAufgabe = (x) => x && x.left === task.prompt;
    const schluss = (ab) => { while (ab.length > 1 && !ab[ab.length - 1].some((x) => x.left)) { const r = ab.pop(); ab[ab.length - 1].push(...r); } return ab; };
    const mitL = alle.some((s) => s.label);
    let ab = [];
    alle.forEach((s) => { const nurA = ab.length === 1 && ab[0].length === 1 && istAufgabe(ab[0][0]); if (!ab.length || ((mitL ? s.label : true) && !nurA)) ab.push([]); ab[ab.length - 1].push(s); });
    ab = schluss(ab);
    if (ab.length < 2) {
      ab = [];
      alle.forEach((s) => { if (ab.length === 1 && ab[0].length === 1 && istAufgabe(ab[0][0])) ab[0].push(s); else ab.push([s]); });
      ab = schluss(ab);
    }
    return ab;
  }
  // ============================================================
  // MINI-FORMEL-RENDERER
  // ============================================================
  function mathToHtml(src) {
    let i = 0;
    const n = src.length;

    function escapeText(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function readGroup(trim) {
      if (src[i] !== "{") {
        const ch = src[i]; i++;
        return escapeText(ch === undefined ? "" : ch);
      }
      i++;
      let depth = 1;
      const start = i;
      while (i < n && depth > 0) {
        if (src[i] === "{") depth++;
        else if (src[i] === "}") depth--;
        if (depth > 0) i++;
      }
      const inner = src.slice(start, i);
      i++;
      const rendered = mathToHtml(inner);
      return trim === false ? rendered : rendered.trim();
    }

    let out = "";
    while (i < n) {
      const c = src[i];
      if (c === "\\") {
        const next = src[i + 1];
        if (next === "," || next === ";" || next === "!" || next === " ") {
          out += " "; i += 2; continue;
        }
        if (next === "%") { out += "%"; i += 2; continue; }
        let j = i + 1, name = "";
        while (j < n && /[a-zA-Z]/.test(src[j])) { name += src[j]; j++; }
        i = j;
        switch (name) {
          case "dfrac": case "frac": {
            const num = readGroup(); const den = readGroup();
            out += `<span class="frac"><span class="num">${num}</span><span class="den">${den}</span></span>`;
            break;
          }
          case "sqrt": {
            let idx = "";
            if (src[i] === "[") {
              i++;
              let depth2 = 1; const start2 = i;
              while (i < n && depth2 > 0) {
                if (src[i] === "[") depth2++;
                else if (src[i] === "]") depth2--;
                if (depth2 > 0) i++;
              }
              idx = src.slice(start2, i);
              i++;
            }
            const inner = readGroup();
            out += idx ? `<sup>${idx}</sup>√(${inner})` : "√(" + inner + ")";
            break;
          }
          case "text": out += `<span class="mtext">${readGroup(false)}</span>`; break;
          case "cdot": out += " · "; break;
          case "ldots": out += "…"; break;
          case "log": out += "log"; break;
          case "ln": out += "ln"; break;
          case "lg": out += "lg"; break;
          case "Leftrightarrow": out += " ⇔ "; break;
          case "Rightarrow": out += " ⇒ "; break;
          case "rightarrow": out += " → "; break;
          case "approx": out += " ≈ "; break;
          case "neq": out += " ≠ "; break;
          case "geq": out += " ≥ "; break;
          case "leq": out += " ≤ "; break;
          case "pm": out += " ± "; break;
          case "square": out += "▢"; break;
          case "sin": case "cos": case "tan": out += name; break;
          case "alpha": out += "α"; break;
          case "beta": out += "β"; break;
          case "gamma": out += "γ"; break;
          case "pi": out += "π"; break;
          case "left": case "right": break; // Größenanpassung nicht nötig, folgendes Klammerzeichen wird normal durchgereicht
          case "quad": out += "  "; break;
          case "qquad": out += "    "; break;
          default: out += name;
        }
      } else if (c === "^") {
        i++; out += "<sup>" + readGroup() + "</sup>";
      } else if (c === "_") {
        i++; out += "<sub>" + readGroup() + "</sub>";
      } else if (c === "{") {
        out += readGroup();
      } else if (c === "}") {
        i++;
      } else {
        out += escapeText(c); i++;
      }
    }
    return out.replace(/[ \t]{2,}/g, " ");
  }

  // ============================================================
  // SVG-FUNKTIONSPLOTTER (kein externes Paket)
  // ============================================================
  function makeTransform(cfg) {
    const { xmin, xmax, ymin, ymax, width, height, padLeft, padRight, padTop, padBottom } = cfg;
    const plotW = width - padLeft - padRight;
    const plotH = height - padTop - padBottom;
    return function toPx(x, y) {
      const px = padLeft + ((x - xmin) / (xmax - xmin)) * plotW;
      const py = padTop + plotH - ((y - ymin) / (ymax - ymin)) * plotH;
      return [px, py];
    };
  }
  function pathForFunction(fn, cfg) {
    const { xmin, xmax, ymin, ymax, samples } = cfg;
    const toPx = makeTransform(cfg);
    const yMargin = (ymax - ymin) * 3;
    let d = "";
    let penDown = false;
    for (let i = 0; i <= samples; i++) {
      const x = xmin + ((xmax - xmin) * i) / samples;
      let y;
      try { y = fn(x); } catch (e) { y = NaN; }
      if (typeof y !== "number" || !isFinite(y) || y < ymin - yMargin || y > ymax + yMargin) {
        penDown = false;
        continue;
      }
      const yClamped = Math.max(ymin - yMargin, Math.min(ymax + yMargin, y));
      const [px, py] = toPx(x, yClamped);
      if (!isFinite(px) || !isFinite(py)) { penDown = false; continue; }
      d += (penDown ? "L " : "M ") + px.toFixed(1) + " " + py.toFixed(1) + " ";
      penDown = true;
    }
    return d.trim();
  }
  function renderGraphSVG(fns, options) {
    const cfg = Object.assign({
      xmin: -3, xmax: 3, ymin: -5, ymax: 5,
      width: 220, height: 180,
      padLeft: 22, padRight: 8, padTop: 8, padBottom: 20,
      samples: 240,
      gridStep: 1,
      colors: ["#2563eb"]
    }, options || {});
    const toPx = makeTransform(cfg);
    const plotX = cfg.padLeft, plotY = cfg.padTop;
    const plotW = cfg.width - cfg.padLeft - cfg.padRight;
    const plotH = cfg.height - cfg.padTop - cfg.padBottom;

    // Gitter: getrennte Schrittweiten für x und y möglich (z. B. Zeit 0..10, Bestand 0..1000)
    const stepX = cfg.gridStepX || cfg.gridStep, stepY = cfg.gridStepY || cfg.gridStep;
    const fmtTick = (v) => String(Math.round(v * 1000) / 1000).replace(".", ",");
    let grid = "", ticks = "";
    for (let gx = Math.ceil(cfg.xmin / stepX) * stepX; gx <= cfg.xmax + 1e-9; gx += stepX) {
      const [px] = toPx(gx, 0);
      grid += `<line x1="${px.toFixed(1)}" y1="${plotY}" x2="${px.toFixed(1)}" y2="${(plotY + plotH).toFixed(1)}" stroke="#e2e8f0" stroke-width="1"/>`;
      if (cfg.ticks && Math.abs(gx) > 1e-9) {
        const ty = Math.min(plotY + plotH, Math.max(plotY, toPx(0, Math.max(cfg.ymin, Math.min(cfg.ymax, 0)))[1]));
        ticks += `<text x="${px.toFixed(1)}" y="${(ty + 11).toFixed(1)}" font-size="9" text-anchor="middle" fill="#475569">${fmtTick(gx)}</text>`;
      }
    }
    for (let gy = Math.ceil(cfg.ymin / stepY) * stepY; gy <= cfg.ymax + 1e-9; gy += stepY) {
      const [, py] = toPx(0, gy);
      grid += `<line x1="${plotX}" y1="${py.toFixed(1)}" x2="${(plotX + plotW).toFixed(1)}" y2="${py.toFixed(1)}" stroke="#e2e8f0" stroke-width="1"/>`;
      if (cfg.ticks && Math.abs(gy) > 1e-9) {
        const tx = Math.min(plotX + plotW, Math.max(plotX, toPx(Math.max(cfg.xmin, Math.min(cfg.xmax, 0)), 0)[0]));
        ticks += `<text x="${(tx - 3).toFixed(1)}" y="${(py + 3).toFixed(1)}" font-size="9" text-anchor="end" fill="#475569">${fmtTick(gy)}</text>`;
      }
    }

    // Achsen auch am Rand zeichnen, wenn 0 genau die Bereichsgrenze ist (z. B. Zeit ab 0)
    let axes = "";
    if (cfg.ymin <= 0 && cfg.ymax >= 0) {
      const [xA, yA] = toPx(cfg.xmin, 0), [xB, yB] = toPx(cfg.xmax, 0);
      axes += `<line x1="${xA.toFixed(1)}" y1="${yA.toFixed(1)}" x2="${xB.toFixed(1)}" y2="${yB.toFixed(1)}" stroke="#64748b" stroke-width="1.2"/>`;
    }
    if (cfg.xmin <= 0 && cfg.xmax >= 0) {
      const [xA, yA] = toPx(0, cfg.ymin), [xB, yB] = toPx(0, cfg.ymax);
      axes += `<line x1="${xA.toFixed(1)}" y1="${yA.toFixed(1)}" x2="${xB.toFixed(1)}" y2="${yB.toFixed(1)}" stroke="#64748b" stroke-width="1.2"/>`;
    }
    if (cfg.achsenNamen) {
      const [ax, ay] = cfg.achsenNamen;
      axes += `<text x="${(plotX + plotW).toFixed(1)}" y="${(plotY + plotH + 18).toFixed(1)}" font-size="10" text-anchor="end" fill="#334155" font-weight="bold">${ax}</text>`;
      axes += `<text x="${(plotX + 2).toFixed(1)}" y="${(plotY + 10).toFixed(1)}" font-size="10" fill="#334155" font-weight="bold">${ay}</text>`;
    }

    const fnList = Array.isArray(fns) ? fns : [{ fn: fns, color: cfg.colors[0] }];
    const clipId = "gclip" + Math.random().toString(36).slice(2, 9);
    let paths = "";
    fnList.forEach((item, idx) => {
      const color = item.color || cfg.colors[idx % cfg.colors.length];
      const d = pathForFunction(item.fn, cfg);
      if (d) {
        paths += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="butt" clip-path="url(#${clipId})"/>`;
      }
      if (item.label) {
        // Beschriftung am rechten Rand, dort wo der Graph sichtbar ist
        for (let k = 0; k <= 40; k++) {
          const x = cfg.xmax - ((cfg.xmax - cfg.xmin) * k) / 40 * 0.9;
          let y; try { y = item.fn(x); } catch (e) { y = NaN; }
          if (isFinite(y) && y > cfg.ymin && y < cfg.ymax) {
            const [px, py] = toPx(x, y);
            paths += `<text x="${(px - 4).toFixed(1)}" y="${Math.max(plotY + 11, py - 6).toFixed(1)}" font-size="11" font-weight="bold" text-anchor="end" fill="${color}" stroke="white" stroke-width="3" paint-order="stroke">${item.label}</text>`;
            break;
          }
        }
      }
    });

    // Markierungen für Musterlösungen: Punkte, Steigungsdreieck, Hilfslinien
    let marks = "";
    (cfg.marks || []).forEach((m) => {
      const col = m.color || "#dc2626";
      if (m.type === "point") {
        const [px, py] = toPx(m.x, m.y);
        marks += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="3.6" fill="${col}" stroke="white" stroke-width="1"/>`;
        // Beschriftung innerhalb der Zeichenfläche halten (grobe Textbreite ~6 px pro Zeichen)
        const lx = Math.max(plotX + 2, Math.min(px + (m.dx === undefined ? 6 : m.dx), plotX + plotW - String(m.label || "").length * 6.2));
        const ly = Math.max(plotY + 10, Math.min(py + (m.dy === undefined ? -6 : m.dy), plotY + plotH - 3));
        if (m.label) marks += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="10" font-weight="bold" fill="${col}" stroke="white" stroke-width="3" paint-order="stroke">${m.label}</text>`;
      } else if (m.type === "triangle") {
        // Steigungsdreieck: von (x|y) waagerecht um dx, dann senkrecht um dy
        const [x0, y0] = toPx(m.x, m.y), [x1] = toPx(m.x + m.dx, m.y), [, y1] = toPx(m.x + m.dx, m.y + m.dy);
        marks += `<path d="M ${x0.toFixed(1)} ${y0.toFixed(1)} L ${x1.toFixed(1)} ${y0.toFixed(1)} L ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${col}" stroke-width="1.8"/>`;
        marks += `<text x="${((x0 + x1) / 2).toFixed(1)}" y="${(y0 + (m.dy >= 0 ? 12 : -4)).toFixed(1)}" font-size="10" font-weight="bold" text-anchor="middle" fill="${col}" stroke="white" stroke-width="3" paint-order="stroke">${fmtTick(m.dx)}</text>`;
        marks += `<text x="${(x1 + 4).toFixed(1)}" y="${((y0 + y1) / 2 + 3).toFixed(1)}" font-size="10" font-weight="bold" fill="${col}" stroke="white" stroke-width="3" paint-order="stroke">${fmtTick(m.dy)}</text>`;
      } else if (m.type === "hline" || m.type === "vline") {
        const [xa, ya] = m.type === "hline" ? toPx(cfg.xmin, m.y) : toPx(m.x, cfg.ymin);
        const [xb, yb] = m.type === "hline" ? toPx(cfg.xmax, m.y) : toPx(m.x, cfg.ymax);
        marks += `<line x1="${xa.toFixed(1)}" y1="${ya.toFixed(1)}" x2="${xb.toFixed(1)}" y2="${yb.toFixed(1)}" stroke="${col}" stroke-width="1.2" stroke-dasharray="4 3"/>`;
        if (m.label) marks += m.type === "hline"
          ? `<text x="${(xa + 4).toFixed(1)}" y="${(ya - 4).toFixed(1)}" font-size="10" fill="${col}" stroke="white" stroke-width="3" paint-order="stroke">${m.label}</text>`
          : `<text x="${(xa + 3).toFixed(1)}" y="${(plotY + 10).toFixed(1)}" font-size="10" fill="${col}" stroke="white" stroke-width="3" paint-order="stroke">${m.label}</text>`;
      }
    });

    return `<svg viewBox="0 0 ${cfg.width} ${cfg.height}" width="${cfg.width}" height="${cfg.height}" xmlns="http://www.w3.org/2000/svg" class="graph-svg">` +
      `<defs><clipPath id="${clipId}"><rect x="${plotX}" y="${plotY}" width="${plotW}" height="${plotH}"/></clipPath></defs>` +
      `<rect x="${plotX}" y="${plotY}" width="${plotW}" height="${plotH}" fill="#ffffff" stroke="#cbd5e1"/>` +
      grid + axes + paths + marks + ticks +
      `</svg>`;
  }

  // ============================================================
  // TEXTAUFGABEN (eine Stufe pro Thema)
  // Gleiche Mathematik wie in den übrigen Stufen, eingebettet in Alltags-
  // situationen. Der Rechenweg wird bei der Erzeugung gleich mitgebaut
  // (task.data.steps), geprüft wird über einen gemeinsamen Checker, der pro
  // Feld weiß, ob eine Zahl, ein (streng gekürzter) Bruch oder eine Auswahl
  // erwartet wird.
  // ============================================================
  const NAMEN = ["Lena", "Tom", "Mia", "Ben", "Emma", "Paul", "Sophie", "Jonas", "Hannah", "Elias", "Lea", "Noah", "Aylin", "Mehmet", "Ida", "Finn", "Marie"];
  function zweiNamen() {
    const n1 = choice(NAMEN);
    let n2; do { n2 = choice(NAMEN); } while (n2 === n1);
    return [n1, n2];
  }
  const T = (s) => `\\text{${s}}`;
  const euro = (x) => x.toFixed(2).replace(".", ",") + " €";
  const tausender = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  // Kaufmännisch runden, robust gegen Gleitkomma-Reste (10837,4999... bei
  // exakt 10837,50 soll 10838 ergeben, wie auf dem Taschenrechner)
  const kevinGehler = 1e-9;
  const roundKfm = (x, d) => { const f = Math.pow(10, d || 0); return Math.round(x * f * (1 + 1e-12) + kevinGehler) / f; };
  const round0 = (x) => roundKfm(x, 0);

  function check_textaufgabe(task, userInputs) {
    const errors = [];
    task.fieldKinds.forEach((kind, idx) => {
      const ans = task.answer[idx];
      const u = userInputs[idx];
      let ok = false;
      if (kind === "choice") {
        ok = u === ans;
      } else if (kind === "fraction") {
        const f = parseUserFraction(u);
        if (f) {
          let n = f.num, d = f.den;
          if (d < 0) { n = -n; d = -d; }
          ok = n === ans.num && d === ans.den; // streng: vollständig gekürzt
        }
      } else {
        const v = parseUserNumber(u);
        const tol = task.tolerances ? task.tolerances[idx] : 1e-9;
        ok = !isNaN(v) && numbersClose(v, ans, tol);
      }
      if (!ok) errors.push(idx);
    });
    return { correct: errors.length === 0, fieldErrors: errors };
  }
  function steps_textaufgabe(task) { return task.data.steps; }

  // Hilfsfunktion: fertiges Aufgabenobjekt aus Feldbeschreibungen bauen
  function textTask(topic, level, subtype, prompt, question, fields, steps, extra) {
    return Object.assign({
      topic, level, subtype, textTask: true,
      prompt, promptText: prompt, question, questionText: question,
      numFields: fields.length,
      fieldLabels: fields.map((f) => f.label),
      fieldKinds: fields.map((f) => f.kind),
      perFieldType: fields.map((f) => (f.kind === "choice" ? "choice" : "text")),
      fieldChoices: fields.map((f) => f.choices || null),
      tolerances: fields.map((f) => (f.tol === undefined ? 1e-9 : f.tol)),
      // Vorzeichen-Knopf pro Feld (gemischte Stufe): nur wo dieser Aufgabentyp
      // an dieser Stelle negative Werte haben kann -- unabhängig von der Lösung
      fieldSigned: fields.map((f) => !!f.signed),
      answer: fields.map((f) => f.answer),
      data: { steps }
    }, extra || {});
  }

  // ============================================================
  // KLASSENARBEITEN nach dem Vorbild echter Arbeiten (Recherche):
  //  - wenige Aufgaben mit Teilaufgaben a), b), c) zu einem Kontext
  //  - Teil A ohne, Teil B mit Taschenrechner
  //  - alle Anforderungsbereiche, AFB III (Begründen, Fehler finden) Pflicht
  //  - Zeichnen/Begründen als Papier-Teil mit Erwartungshorizont + Musterlösung
  // ============================================================
  const mische = (arr) => arr.map((x) => [Math.random(), x]).sort((a, b) => a[0] - b[0]).map((x) => x[1]);
  function bruchTex(n, d) {
    if (d < 0) { n = -n; d = -d; }
    const g = gcd(n, d) || 1; n /= g; d /= g;
    if (d === 1) return `${n}`;
    return n < 0 ? `-\\dfrac{${-n}}{${d}}` : `\\dfrac{${n}}{${d}}`;
  }
  const bruchTxt = (n, d) => { const g = gcd(n, d) || 1; n /= g; d /= g; if (d < 0) { n = -n; d = -d; } return d === 1 ? `${n}` : `${n}/${d}`; };
  function geradeTex(name, mn, md, b, v) {
    v = v || "x";
    const g = gcd(mn, md) || 1; let n = mn / g, d = md / g; if (d < 0) { n = -n; d = -d; }
    let mt = d === 1 ? (n === 1 ? "" : n === -1 ? "-" : `${n}`) : (n < 0 ? `-\\dfrac{${-n}}{${d}}` : `\\dfrac{${n}}{${d}}`);
    const bt = b === 0 ? "" : b > 0 ? ` + ${fmtNum(b)}` : ` - ${fmtNum(-b)}`;
    return `${name} = ${mt}${v}${bt}`;
  }
  // Ausschnitt für eine Gerade: enthält 0, y-Achsenabschnitt und Nullstelle
  function fensterGerade(m, b, extraX) {
    const xs = [0, 4].concat(m !== 0 ? [-b / m] : []).concat(extraX || []);
    const xmin = Math.max(-8, Math.floor(Math.min(...xs)) - 1), xmax = Math.min(10, Math.ceil(Math.max(...xs)) + 1);
    const ys = [b, m * xmin + b, m * xmax + b, 0];
    const ymin = Math.max(-10, Math.floor(Math.min(...ys)) - 1), ymax = Math.min(10, Math.ceil(Math.max(...ys)) + 1);
    return { xmin, xmax, ymin, ymax, width: 300, height: 240, padLeft: 26, padBottom: 22, ticks: true };
  }
  const svgGraph = (fns, cfg) => renderGraphSVG(fns, cfg);

  // ---------- Bausteine für Teilaufgaben ----------
  // auto-Teil: Felder werden vom Tool geprüft
  function autoTeil(text, felder, loesung, extra) {
    const t = textTask("klassenarbeit", 0, "", "", "", felder, loesung);
    return Object.assign({ art: "auto", text, task: t, punkte: felder.map((f) => f.punkte || 1), pruefe: (inp) => check_textaufgabe(t, inp), loesung }, extra || {});
  }
  // Teil aus einer bestehenden, getesteten Übungsstufe
  function stufenTeil(topicKey, levelId, filter, textVorweg) {
    const level = TOPICS[topicKey].levels.find((l) => l.id === levelId);
    let task; for (let i = 0; i < 200; i++) { task = level.generate(); if (!filter || filter(task)) break; }
    const text = (textVorweg || "") + (task.prompt || "") + (task.question ? `\\;\\;${task.question}` : "");
    return { art: "auto", text, task, level, punkte: task.answer.map(() => 1), pruefe: (inp) => level.check(task, inp), loesung: level.steps(task) };
  }
  // Papier-Teil: auf Papier lösen, danach selbst anhand des Erwartungshorizonts bewerten
  function papierTeil(text, erwartung, loesung, loesungsGraph) {
    return { art: "papier", text, erwartung, punkte: [erwartung.reduce((s, e) => s + e.punkte, 0)], loesung, loesungsGraph };
  }
  // Aussage prüfen (AFB III): wahr/falsch + passende Begründung auswählen
  function aussageTeil(aussage, wahr, gruende, erklaerung) {
    return autoTeil(aussage, [
      { label: "Stimmt die Aussage?", kind: "choice", choices: ["wahr", "falsch"], answer: wahr ? "wahr" : "falsch" },
      { label: "Begründung", kind: "choice", choices: mische(gruende), answer: gruende[0] }
    ], [{ label: wahr ? "Die Aussage ist wahr." : "Die Aussage ist falsch." }, { left: T(gruende[0]), right: "" }].concat(erklaerung || []));
  }
  // Fehler im Lösungsweg finden (AFB III): Fehler benennen + richtig rechnen
  function fehlerTeil(text, gruende, richtigFeld, loesung) {
    return autoTeil(text, [
      { label: "Welcher Fehler wurde gemacht?", kind: "choice", choices: mische(gruende), answer: gruende[0] },
      richtigFeld
    ], [{ label: "Fehler" }, { left: T(gruende[0]), right: "" }].concat(loesung));
  }

  const KA_VORLAGEN = {};
  const KA_INFO = {};
  // Notenschlüssel (Recherche: "ausreichend" ab etwa 50 %, eher streng gewählt)
  const KA_NOTEN = [[90, 1], [77, 2], [63, 3], [50, 4], [25, 5], [0, 6]];

  // Stellt eine Klassenarbeit zusammen: 45 min -> 4 Aufgaben, 90 min -> 6 Aufgaben;
  // mindestens eine AFB-III-Aufgabe, Teil A (ohne TR) vor Teil B (mit TR).
  // Manche Themen werden in echten Arbeiten getrennt geprüft (z. B. Trigonometrie:
  // rechtwinklige vs. allgemeine Dreiecke). KA_TEILGEBIETE[thema] = [[schluessel, Name], ...]
  const KA_TEILGEBIETE = {};
  function erzeugeKlassenarbeit(topicKey, minuten, teilgebiet) {
    const gebiete = KA_TEILGEBIETE[topicKey];
    if (gebiete && !gebiete.some(([k]) => k === teilgebiet)) teilgebiet = gebiete[0][0];
    const vorl = KA_VORLAGEN[topicKey].filter((v) => !gebiete || v.gebiet === teilgebiet), info = Object.assign({}, KA_INFO[topicKey], (KA_INFO[topicKey].gebiete || {})[teilgebiet] || {});
    const anzahl = minuten >= 90 ? 6 : 4;
    const afb3 = mische(vorl.filter((v) => v.afb === 3))[0];
    let rest = mische(vorl.filter((v) => v !== afb3)), wahl = [afb3];
    if (info.tr) {

    const k = kandidaten.filter(([x]) => isFinite(x)).map(([x, h]) => [Math.abs(v - x) / Math.max(1, Math.abs(x)), h])

  function gen_potenz_1() {
    // Zahlenbereich pro Exponent begrenzt, damit die Ergebnisse tatsächlich
    // im Kopf nachvollziehbar bleiben (kein 9^4 = 6561):
    //   Quadrate:      Basis bis 12  -> Ergebnis bis 144
    //   Kubikzahlen:   Basis bis 5   -> Ergebnis bis 125
    //   4. Potenzen:   Basis bis 3   -> Ergebnis bis 81
    const n = choice([2, 2, 2, 2, 3, 3, 4]); // Quadrate am häufigsten
    let baseMax;
    if (n === 2) baseMax = 12;
    else if (n === 3) baseMax = 5;
    else baseMax = 3;
    const bases = [];
    for (let v = 2; v <= baseMax; v++) { bases.push(v); bases.push(-v); }
    const a = choice(bases);
    const answer = Math.pow(a, n);
    return {
      topic: "potenzrechnung", level: 1,
      prompt: `${baseStr(a)}^{${n}}`,
      promptText: `${baseStr(a)}^${n}`,
      numFields: 1,
      fieldLabels: ["Ergebnis"],
      answer: [answer],
      data: { a, n }
    };
  }
  function check_potenz_1(task, userInputs) {
    const v = parseUserNumber(userInputs[0]);
    if (isNaN(v)) return { correct: false, fieldErrors: [0] };
    return { correct: v === task.answer[0], fieldErrors: v === task.answer[0] ? [] : [0] };
  }
  function steps_potenz_1(task) {
    const { a, n } = task.data;
    const steps = [];
    const factorStr = Array(n).fill(`(${a})`).join(" \\cdot ");
    steps.push({ left: `${baseStr(a)}^{${n}} = ${factorStr}`, right: "ausschreiben" });
    let running = a;
    for (let i = 1; i < n; i++) {
      running = running * a;
      steps.push({ left: `= ${running}`, right: `\\cdot(${a})` });
    }
    return steps;
  }

    const graphs = shuffledGraphItems.map((item, idx) => ({
      id: "G" + (idx + 1),
      fn: item.fn,
      term: item.term

    // Alle wählbaren Terme (4 richtige + 2 Ablenker), gemischt
    const allChoiceItems = [...graphItems, ...decoyItems].sort(() => Math.random() - 0.5);
    const fieldOptions = allChoiceItems.map((item) => ({

  // ---- Stufe 10: Wissenschaftliche Schreibweise (mit Einheitenvorsätzen) ----
  const VORSAETZE = [["k", 3, "Kilo"], ["M", 6, "Mega"], ["G", 9, "Giga"], ["m", -3, "Milli"], ["µ", -6, "Mikro"], ["n", -9, "Nano"]];
  const dezStr = (m, e) => { // m · 10^e als ausgeschriebene Dezimalzahl (m mit höchstens 2 Nachkommastellen)
    const z = String(m).replace(".", ""), komma = String(m).indexOf(".") === -1 ? String(m).length : String(m).indexOf(".");
    const pos = komma + e;
    if (pos <= 0) return "0," + "0".repeat(-pos) + z.replace(/0+$/, "");
    if (pos >= z.length) return tausender(z + "0".repeat(pos - z.length));
    return z.slice(0, pos) + "," + z.slice(pos);
  };
  function gen_potenz_10() {
    const sub = choice(["zuWiss", "zuWiss", "zurueck", "einheit", "rechnen"]);
    const m = choice([1.5, 2, 2.4, 3.2, 4.5, 6, 7.25, 8.1, 9.6]);
    if (sub === "zuWiss" || sub === "zurueck") {
      const e = choice([-7, -6, -5, -4, -3, -2, 3, 4, 5, 6, 7, 8]);
      if (sub === "zuWiss") return { topic: "potenzrechnung", level: 10, subtype: sub, signed: true, prompt: dezStr(m, e), promptText: "wiss",
        question: `\\text{Schreibe in wissenschaftlicher Schreibweise:}\\;\\; a\\cdot 10^{n}\\;\\; (1 \\leq a < 10)`, numFields: 2, fieldLabels: ["a", "n"], answer: [m, e], data: { m, e } };
      return { topic: "potenzrechnung", level: 10, subtype: sub, signed: true, prompt: `${fmtNum(m)}\\cdot 10^{${e}}`, promptText: "zurück",
        question: `\\text{Schreibe als Dezimalzahl.}`, numFields: 1, fieldLabels: ["Dezimalzahl"], answer: [Number((m * Math.pow(10, e)).toPrecision(12))], data: { m, e } };
    }
    if (sub === "einheit") {
      const [vs, ve, vname] = choice(VORSAETZE), einheit = choice([["m", "Meter"], ["g", "Gramm"], ["W", "Watt"]]), zahl = choice([2, 3, 5, 12, 25, 45, 250, 640]);
      const exp10 = Math.floor(Math.log10(zahl)), a = zahl / Math.pow(10, exp10), n = exp10 + ve;
      return { topic: "potenzrechnung", level: 10, subtype: sub, signed: true, prompt: T(`${zahl} ${vs}${einheit[0]}`), promptText: "Einheit",
        question: `\\text{Schreibe in ${einheit[1]} (${einheit[0]}) in wissenschaftlicher Schreibweise.}`, numFields: 2, fieldLabels: ["a", "n"], answer: [a, n], data: { zahl, vs, ve, vname, a, n } };
    }
    const m1 = choice([2, 3, 4, 5, 6, 8]), m2 = choice([2, 3, 4, 5, 1.5, 2.5]), e1 = randInt(-6, 8), e2 = randInt(-6, 8), op = choice(["mal", "durch"]);
    let a = op === "mal" ? m1 * m2 : m1 / m2, n = op === "mal" ? e1 + e2 : e1 - e2;
    while (a >= 10) { a /= 10; n++; } while (a < 1) { a *= 10; n--; }
    a = Number(a.toPrecision(10));
    if (String(a).split(".")[1] && String(a).split(".")[1].length > 3) return gen_potenz_10();
    return { topic: "potenzrechnung", level: 10, subtype: sub, signed: true, prompt: `(${fmtNum(m1)}\\cdot 10^{${e1}}) ${op === "mal" ? "\\cdot" : ":"} (${fmtNum(m2)}\\cdot 10^{${e2}})`, promptText: "rechnen",
      question: `\\text{Berechne. Ergebnis in wissenschaftlicher Schreibweise.}`, numFields: 2, fieldLabels: ["a", "n"], answer: [a, n], data: { m1, m2, e1, e2, op } };
  }
  function check_potenz_10(task, inp) { const err = []; task.answer.forEach((x, i) => { const v = parseUserNumber(inp[i]); if (isNaN(v) || Math.abs(v - x) > 1e-9 * Math.max(1, Math.abs(x))) err.push(i); }); return { correct: !err.length, fieldErrors: err }; }
  function steps_potenz_10(task) {
    const d = task.data, s = task.subtype;
    if (s === "zuWiss") return [{ label: "Komma so verschieben, dass genau eine Ziffer (nicht 0) davor steht; Anzahl der Stellen = Exponent (nach links +, nach rechts −)" }, { left: `${dezStr(d.m, d.e)} = ${fmtNum(d.m)}\\cdot 10^{${d.e}}`, right: "" }];
    if (s === "zurueck") return [{ label: d.e > 0 ? `Komma um ${d.e} Stellen nach rechts` : `Komma um ${-d.e} Stellen nach links` }, { left: `${fmtNum(d.m)}\\cdot 10^{${d.e}} = ${dezStr(d.m, d.e)}`, right: "" }];
    if (s === "einheit") return [{ label: `${d.vname} bedeutet 10^${d.ve}` }, { left: `${d.zahl}\\cdot 10^{${d.ve}} = ${fmtNum(d.a)}\\cdot 10^{${d.n}}`, right: "" }];
    const [a, n] = task.answer;
    return [{ label: "Zahlen und Zehnerpotenzen getrennt rechnen (Exponenten addieren bzw. subtrahieren), danach a wieder zwischen 1 und 10 bringen" },

  }

  // ---- Stufe 11: Zusammenfassen, gleiche Exponenten, Wurzeln vereinfachen ----
  function gen_potenz_11() {
    const sub = choice(["gleicherExp", "zusammenfassen", "wurzelAdd", "teilweise"]);
    if (sub === "gleicherExp") {
      const [p, q] = choice([[2, 5], [4, 25], [5, 2], [2.5, 4], [0.5, 4]]), n = randInt(2, 4), div = Math.random() < 0.4;
      if (div) { const [c, k] = choice([[12, 4], [15, 5], [36, 12], [20, 4]]), m2 = randInt(2, 3); return { topic: "potenzrechnung", level: 11, subtype: sub, prompt: `${c}^{${m2}} : ${k}^{${m2}}`, promptText: "gleicher Exp",
        question: `\\text{Berechne geschickt (ohne Taschenrechner).}`, numFields: 1, fieldLabels: ["Ergebnis"], answer: [Math.pow(c / k, m2)], data: { a: c, b: k, n: m2, div: true } }; }
      return { topic: "potenzrechnung", level: 11, subtype: sub, prompt: `${fmtNum(p)}^{${n}}\\cdot ${fmtNum(q)}^{${n}}`, promptText: "gleicher Exp",
        question: `\\text{Berechne geschickt (ohne Taschenrechner).}`, numFields: 1, fieldLabels: ["Ergebnis"], answer: [Math.round(Math.pow(p * q, n))], data: { a: p, b: q, n, div: false } };
    }
    if (sub === "zusammenfassen") {
      const n = randInt(2, 5), v = choice(["x", "a", "y"]), ks = [randInt(2, 9), randInt(1, 9), randInt(1, 9)], vz = [1, choice([1, -1]), choice([1, -1])];
      const k = ks.reduce((s, x, i) => s + vz[i] * x, 0);
      const term = ks.map((x, i) => `${i === 0 ? "" : vz[i] > 0 ? " + " : " - "}${x === 1 ? "" : x}${v}^{${n}}`).join("");
      return { topic: "potenzrechnung", level: 11, subtype: sub, signed: true, prompt: term, promptText: "zusammenfassen",
        question: `\\text{Fasse zusammen:}\\;\\; \\;?\\,${v}^{\\;?}`, numFields: 2, fieldLabels: ["Zahl davor", "Exponent"], answer: [k, n], data: { ks, vz, n } };
    }
    if (sub === "teilweise") {
      const r = choice([2, 3, 5, 6, 7]), q = randInt(2, 6);
      return { topic: "potenzrechnung", level: 11, subtype: sub, prompt: `\\sqrt{${q * q * r}}`, promptText: "teilweise",
        question: `\\text{Ziehe teilweise die Wurzel:}\\;\\; a\\sqrt{b}\\;\\; ${T("(b so klein wie möglich)")}`, numFields: 2, fieldLabels: ["a", "b"], answer: [q, r], data: { q, r } };
    }
    const r = choice([2, 3, 5]), [q1, q2] = [randInt(2, 4), randInt(2, 5)], vz = choice([1, -1]);
    return { topic: "potenzrechnung", level: 11, subtype: "wurzelAdd", signed: true, prompt: `\\sqrt{${q1 * q1 * r}} ${vz > 0 ? "+" : "-"} \\sqrt{${q2 * q2 * r}}`, promptText: "Wurzeln addieren",
      question: `\\text{Vereinfache:}\\;\\; \\;?\\,\\sqrt{${r}}`, numFields: 1, fieldLabels: [`Zahl vor √${r}`], answer: [q1 + vz * q2], data: { q1, q2, r, vz } };
  }
  function steps_potenz_11(task) {
    const d = task.data, s = task.subtype;
    if (s === "gleicherExp") return d.div ? [{ label: "Gleicher Exponent: erst die Basen dividieren" }, { left: `${d.a}^{${d.n}} : ${d.b}^{${d.n}} = (${d.a} : ${d.b})^{${d.n}} = ${d.a / d.b}^{${d.n}} = ${task.answer[0]}`, right: "" }]
      : [{ label: "Gleicher Exponent: erst die Basen multiplizieren" }, { left: `(${fmtNum(d.a)}\\cdot ${fmtNum(d.b)})^{${d.n}} = ${fmtNum(d.a * d.b)}^{${d.n}} = ${task.answer[0]}`, right: "" }];
    if (s === "zusammenfassen") return [{ label: "Nur gleichartige Potenzen (gleiche Basis UND gleicher Exponent) addieren: Zahlen davor verrechnen, Exponent bleibt" }, { left: `= ${task.answer[0]}\\,x^{${d.n}}`.replace("x", task.prompt.match(/[xay]/)[0]), right: "" }];
    if (s === "teilweise") return [{ label: "Den größten Quadratfaktor herausziehen" }, { left: `\\sqrt{${d.q * d.q * d.r}} = \\sqrt{${d.q * d.q}\\cdot ${d.r}} = ${d.q}\\sqrt{${d.r}}`, right: "" }];
    return [{ label: "Erst teilweise radizieren, dann gleichartige Wurzeln zusammenfassen" }, { left: `${d.q1}\\sqrt{${d.r}} ${d.vz > 0 ? "+" : "-"} ${d.q2}\\sqrt{${d.r}} = ${task.answer[0]}\\sqrt{${d.r}}`, right: "" }];
  }

  function gen_expo_1() {
    const a = choice([50, 100, 150, 200, 250, 300, 400, 500]);

    const p = growth ? choice([5, 10, 15, 20, 25, 30]) : choice([5, 10, 15, 20, 25, 30, 35, 40]);
    const b = growth ? 1 + p / 100 : 1 - p / 100;
    const x = randInt(1, 6);
    const exact = a * Math.pow(b, x);
    const answer = round2(exact);
    return {
      topic: "exponentialrechnung", level: 1,
      prompt: `f(x) = ${a}\\cdot${fmtNum(round2(b))}^{x}`,
      promptText: `f(x) = ${a} · ${round2(b)}^x`,
      question: `f(${x}) = \\;?`,

    };
  }

      const q = growth ? randInt(105, 250) : randInt(5, 95);
      b = round2(q / 100);
      rendered = phrase.make(q);
      data = { mode: "auf", q, growth, b };
    }
    return {
      topic: "exponentialrechnung", level: 2,
      prompt: rendered.prompt,
      promptText: rendered.text,
      question: `b = \\;?`,
      questionText: `Wachstumsfaktor b = ?`,
      numFields: 1,
      fieldLabels: ["b"],
      tolerance: 0.005,
      answer: [b],
      data
    };
  }
  function check_expo_2(task, userInputs) {
    const v = parseUserNumber(userInputs[0]);
    if (isNaN(v)) return { correct: false, fieldErrors: [0] };
    const ok = numbersClose(v, task.answer[0], task.tolerance);
    return { correct: ok, fieldErrors: ok ? [] : [0] };
  }
  function steps_expo_2(task) {
    const { mode, p, q, growth, b } = task.data;
    if (mode === "um") {
      return [
        { left: `b = 1 ${growth ? "+" : "-"} \\dfrac{${p}}{100}`, right: growth ? "Zuwachs" : "Abnahme" },
        { left: `= ${fmtNum(b)}`, right: "" }
      ];
    }
    return [
      { left: `b = \\dfrac{${q}}{100}`, right: "Zielwert direkt als Faktor (keine Subtraktion nötig)" },
      { left: `= ${fmtNum(b)}`, right: "" }
    ];
  }

  function gen_expo_3() {
    const growth = Math.random() < 0.7;
    const p = growth ? choice([5, 8, 10, 12, 15, 18, 20, 25, 30]) : choice([5, 10, 15, 20, 25, 30]);
    const b = growth ? 1 + p / 100 : 1 - p / 100;
    const c = growth ? choice([2, 3, 4, 5, 10]) : choice([0.5, 0.25, 0.1]);
    const exact = Math.log(c) / Math.log(b);
    const answer = round2(exact);
    return {
      topic: "exponentialrechnung", level: 3,
      prompt: `${fmtNum(round2(b))}^{x} = ${fmtNum(c)}`,
      promptText: `${round2(b)}^x = ${c}`,
      question: `x = \\;?`,
      questionText: `x = ?`,
      numFields: 1,
      fieldLabels: ["x (auf 2 Nachkommastellen runden)"],
      tolerance: 0.05,
      answer: [answer],
      data: { b, c, exact, p, growth }
    };
  }
  function check_expo_3(task, userInputs) {
    const v = parseUserNumber(userInputs[0]);
    if (isNaN(v)) return { correct: false, fieldErrors: [0] };
    const ok = numbersClose(v, task.answer[0], task.tolerance);
    return { correct: ok, fieldErrors: ok ? [] : [0] };
  }
  function steps_expo_3(task) {
    const { b, c, exact } = task.data;
    return [
      { left: `${fmtNum(round2(b))}^{x} = ${fmtNum(c)}`, right: "" },
      { left: `\\ln(${fmtNum(round2(b))}^{x}) = \\ln(${fmtNum(c)})`, right: "\\ln(\\ldots) anwenden" },
      { left: `x\\cdot\\ln(${fmtNum(round2(b))}) = \\ln(${fmtNum(c)})`, right: "Potenzregel" },
      { left: `x = \\dfrac{\\ln(${fmtNum(c)})}{\\ln(${fmtNum(round2(b))})}`, right: `:\\ln(${fmtNum(round2(b))})` },
      { left: `x \\approx ${fmtNum(round2(exact))}`, right: "" }
    ];
  }

  const SZENARIEN = [
    { subject: "Bakterienkultur", unit: "Std.", unitDative: "Std.", verbGrowth: "wächst", verbDecay: "nimmt ab", startWord: "Start" },
    { subject: "Investition", unit: "Jahre", unitDative: "Jahren", verbGrowth: "wächst", verbDecay: "verliert an Wert", startWord: "Startkapital" },
    { subject: "Bevölkerung einer Stadt", unit: "Jahre", unitDative: "Jahren", verbGrowth: "wächst", verbDecay: "schrumpft", startWord: "Start" },
    { subject: "radioaktive Substanz", unit: "Jahre", unitDative: "Jahren", verbGrowth: "wächst", verbDecay: "zerfällt", startWord: "Anfangsmenge", onlyDecay: true }
  ];
  function gen_expo_4() {
    const scenario = choice(SZENARIEN);
    const growth = scenario.onlyDecay ? false : Math.random() < 0.6;
    const a = choice([50, 100, 200, 500, 1000]);
    const p = growth ? choice([5, 8, 10, 12, 15, 20, 25]) : choice([5, 10, 15, 20, 25, 30]);
    const b = growth ? 1 + p / 100 : 1 - p / 100;
    const factor = growth ? choice([2, 3, 4, 5]) : choice([0.5, 0.25]);
    const target = round2(a * factor);
    const exact = Math.log(factor) / Math.log(b);
    const verb = growth ? scenario.verbGrowth : scenario.verbDecay;
    const roundMode = choice(["exact", "ceil"]);

    let question, questionText, answer, fieldLabel, tolerance;
    if (roundMode === "exact") {
      question = `\\text{Nach wie vielen ${scenario.unitDative} ist der Wert }${fmtNum(target)}\\text{ erreicht?}`;
      questionText = `Nach wie vielen ${scenario.unitDative} ist ${fmtNum(target)} erreicht?`;
      answer = round2(exact);
      fieldLabel = "Anzahl (auf 2 Nachkommastellen runden)";
      tolerance = 0.05;
    } else {
      // Ganzzahlige Variante: kleinste volle Zeiteinheit, bei der der Zielwert
      // tatsächlich über-/unterschritten ist (nicht nur "ungefähr erreicht").
      const verbUeber = growth ? "überschritten" : "unterschritten";
      question = `\\text{Ab wie vielen ${scenario.unitDative} ist der Wert }${fmtNum(target)}\\text{ ${verbUeber}?}`;
      questionText = `Ab wie vielen ${scenario.unitDative} ist ${fmtNum(target)} ${verbUeber}?`;
      answer = Math.floor(exact) + 1; // robust auch falls exact zufällig ganzzahlig wäre
      fieldLabel = "Anzahl (ganze Zahl)";
      tolerance = 0.01;
    }

    return {
      topic: "exponentialrechnung", level: 4,
      prompt: `\\text{${scenario.subject}: }${scenario.startWord} = ${a},\\; ${p}\\,\\%\\text{ pro ${scenario.unit.slice(0, -1)}, ${verb}}`,
      promptText: `${scenario.subject}: ${scenario.startWord}=${a}, ${p}% pro ${scenario.unit.slice(0, -1)} (${verb})`,
      question, questionText,
      numFields: 1,
      fieldLabels: [fieldLabel],
      tolerance,
      answer: [answer],
      data: { scenario, a, p, b, factor, target, exact, growth, roundMode }
    };
  }
  function check_expo_4(task, userInputs) {
    const v = parseUserNumber(userInputs[0]);
    if (isNaN(v)) return { correct: false, fieldErrors: [0] };
    const ok = numbersClose(v, task.answer[0], task.tolerance);
    return { correct: ok, fieldErrors: ok ? [] : [0] };
  }
  function steps_expo_4(task) {
    const { a, p, b, factor, target, exact, growth, roundMode } = task.data;
    const steps = [
      { left: `b = 1 ${growth ? "+" : "-"} \\dfrac{${p}}{100} = ${fmtNum(round2(b))}`, right: "Wachstumsfaktor" },
      { left: `${a}\\cdot${fmtNum(round2(b))}^{x} = ${fmtNum(target)}`, right: "Zielwert einsetzen" },
      { left: `${fmtNum(round2(b))}^{x} = ${fmtNum(round2(target / a))}`, right: `:${a}` },
      { left: `x = \\dfrac{\\ln(${fmtNum(round2(target / a))})}{\\ln(${fmtNum(round2(b))})}`, right: "\\ln anwenden" },
      { left: `x \\approx ${fmtNum(round2(exact))}`, right: "genauer Wert" }
    ];
    if (roundMode === "ceil") {
      const rounded = Math.floor(exact) + 1;
      steps.push({ left: `\\text{Antwort: } ${rounded}`, right: "auf ganze Zahl aufrunden" });
    }
    return steps;
  }

  // ---- Stufe 5: Rendite / Wachstumsrate berechnen (Kl. 10, Übergang Oberstufe) ----
  // Umkehrung von Stufe 1: hier sind Start- und Endwert sowie die Laufzeit bekannt,
  // gesucht ist die Rate selbst -- braucht eine n-te Wurzel statt eines Logarithmus.
  function gen_expo_5() {
    const V = choice([500, 1000, 2000, 5000, 10000]);
    const growth = Math.random() < 0.75;
    // Laufzeit und Rate so begrenzt, dass der gerundete Endwert (2 Nachkomma-
    // stellen) genug Präzision behält -- bei starkem, langem Wertverlust würde
    // der Cent-gerundete Wert sonst zu ungenau für eine stabile Rückrechnung.
    const n = growth ? choice([5, 8, 10, 12, 15, 18, 20, 25, 30]) : choice([5, 8, 10, 12, 15, 18, 20]);
    const rTrue = growth ? randInt(2, 15) : -randInt(2, 8);
    const b = 1 + rTrue / 100;
    const VnDisplay = round2(V * Math.pow(b, n));
    // 4 statt 2 Nachkommastellen, damit ein Schüler, der dem angezeigten
    // Rechenweg exakt folgt, auf dieselbe (auf 2 Stellen gerundete) Endantwort
    // kommt wie die hinterlegte Musterlösung -- bei nur 2 Nachkommastellen
    // ginge hier zu viel Präzision verloren (v.a. bei Wertverlust über
    // mehrere Jahre) und die Musterlösung wäre nicht mehr reproduzierbar.
    const ratio = round4(VnDisplay / V);
    const answer = round2((Math.pow(VnDisplay / V, 1 / n) - 1) * 100);
    return {
      topic: "exponentialrechnung", level: 5,
      prompt: `\\text{Startvermögen: }${V}\\,€,\\;\\text{nach }${n}\\text{ Jahren: }${fmtNum(VnDisplay)}\\,€`,
      promptText: `Startvermögen: ${V} €, nach ${n} Jahren: ${fmtNum(VnDisplay)} €`,
      question: `\\text{Rendite } r = \\;?\\,\\%`,
      questionText: `Rendite r = ? %`,
      numFields: 1,
      fieldLabels: ["r (in %, auf 2 Nachkommastellen runden)"],
      tolerance: 0.1,
      answer: [answer],
      data: { V, n, VnDisplay, ratio, answer }
    };
  }
  function check_expo_5(task, userInputs) {
    const v = parseUserNumber(userInputs[0]);
    if (isNaN(v)) return { correct: false, fieldErrors: [0] };
    const ok = numbersClose(v, task.answer[0], task.tolerance);
    return { correct: ok, fieldErrors: ok ? [] : [0] };
  }
  function steps_expo_5(task) {
    const { V, n, VnDisplay, ratio, answer } = task.data;
    return [
      { left: `${V}\\cdot(1+\\dfrac{r}{100})^{${n}} = ${fmtNum(VnDisplay)}`, right: "Formel einsetzen" },
      { left: `(1+\\dfrac{r}{100})^{${n}} = ${fmtNum(ratio)}`, right: `:${V}` },
      { left: `1+\\dfrac{r}{100} = \\sqrt[${n}]{${fmtNum(ratio)}}`, right: `${n}\\text{-te Wurzel ziehen}` },
      { left: `r = (\\sqrt[${n}]{${fmtNum(ratio)}}-1)\\cdot 100`, right: "" },
      { left: `r \\approx ${fmtNum(answer)}\\,\\%`, right: "" }
    ];
  }

  // ---------------- Exponentialrechnung: Textaufgaben ----------------
  // Kleinster ganzer Zeitschritt, ab dem ein Wert eine Grenze erstmals
  // über- bzw. unterschreitet (schrittweise statt über den Logarithmus,
  // damit auch der Sonderfall "genau getroffen" stimmt).
  function ersteSchritte(start, b, grenze, wachsend) {
    let v = start, k = 0;
    while (wachsend ? v <= grenze : v >= grenze) { v *= b; k++; }
    return k;
  }
  function logSchritte(b, f, einheit, k, wachsend) {
    return [
      { label: `Gesucht: kleinstes x mit ${fmtNum(round4(b))}^x ${wachsend ? ">" : "<"} ${fmtNum(round4(f))}` },
      { left: `x = \\dfrac{\\ln(${fmtNum(round4(f))})}{\\ln(${fmtNum(round4(b))})} \\approx ${fmtNum(round2(Math.log(f) / Math.log(b)))}`, right: "" },
      { label: "Erstmals über-/unterschritten: auf die nächste ganze Zahl aufrunden" },
      { left: T(`nach ${anz(k, einheit[0], einheit[1])}`), right: "" }
    ];
  }

  function gen_expo_6() {
    const sub = choice(["geschenk", "sparziel", "inflation", "auto", "medikament", "follower", "stadt", "rendite", "seerose"]);
    const n = choice(NAMEN);
    if (sub === "geschenk") {
      const K = choice([500, 1000, 1500, 2000, 3000]), p = choice([1.5, 2, 2.5, 3, 3.5]), N = randInt(3, 10);
      const Kn = roundKfm(K * Math.pow(1 + p / 100, N), 2);
      return textTask("exponentialrechnung", 6, "geschenk",
        T(`Zur Geburt legen ${genitiv(n)} Großeltern ${tausender(K)} € auf einem Sparbuch an: ${fmtNum(p)} % Zinsen pro Jahr, die Zinsen werden jedes Jahr mitverzinst. Ausgezahlt wird das Geld, wenn ${n} ${N} Jahre alt ist.`),
        T(`Wie viel Geld bekommt ${n} dann ausgezahlt? (auf Cent runden)`), [
          { label: "Auszahlung in €", kind: "number", answer: Kn, tol: 0.011 }
        ], [
          { label: "Wachstumsfaktor pro Jahr" }, { left: `1 + \\dfrac{${fmtNum(p)}}{100} = ${fmtNum(round4(1 + p / 100))}`, right: "" },
          { label: "Guthaben = Startbetrag · Faktor^Jahre" }, { left: `${K}\\cdot ${fmtNum(round4(1 + p / 100))}^{${N}} \\approx ${fmtNum(Kn.toFixed(2))}`, right: "" }
        ], { dataExtra: { K, p, N } });
    }
    if (sub === "sparziel") {
      let K, p, f, Z, b, k;
      do {
        K = choice([1000, 1200, 2000, 2400, 3000]); p = choice([1.5, 2, 2.5, 3, 4]); f = choice([1.1, 1.2, 1.25]);
        Z = Math.round(K * f); b = 1 + p / 100; k = ersteSchritte(1, b, f, true);
      } while (k > 12);
      return textTask("exponentialrechnung", 6, "sparziel",
        T(`${n} hat ${tausender(K)} € gespart und legt das Geld zu ${fmtNum(p)} % Zinsen pro Jahr an (mit Zinseszins). Für ein E-Bike braucht ${n} ${tausender(Z)} €.`),
        T("Nach wie vielen Jahren ist erstmals genug Geld für das E-Bike da?"), [
          { label: "Anzahl Jahre", kind: "number", answer: k }
        ], [{ label: `Ziel : Startbetrag = ${tausender(Z)} : ${tausender(K)} = ${fmtNum(f)}` }].concat(logSchritte(b, f, ["Jahr", "Jahren"], k, true)),
        { dataExtra: { K, p, Z } });
    }
    if (sub === "inflation") {
      const K = choice([500, 1000, 2000, 5000]), p = choice([1.5, 2, 2.5, 3, 4]), N = choice([5, 8, 10, 15, 20]);
      const V = roundKfm(K / Math.pow(1 + p / 100, N), 0);
      return textTask("exponentialrechnung", 6, "inflation",
        T(`${n} versteckt ${tausender(K)} € in einer Schublade, statt sie anzulegen. Die Preise steigen jedes Jahr um ${fmtNum(p)} %.`),
        T(`Wie viel ist das Geld nach ${N} Jahren noch wert, gemessen an den heutigen Preisen? (auf ganze Euro runden)`), [
          { label: "Kaufkraft in heutigen Euro", kind: "number", answer: V, tol: 1 }
        ], [
          { label: "Die Preise wachsen mit dem Faktor " + fmtNum(round4(1 + p / 100)) + " pro Jahr, das Geld behält seinen Nennwert." },
          { label: "Kaufkraft = Betrag : Faktor^Jahre" },
          { left: `${K} : ${fmtNum(round4(1 + p / 100))}^{${N}} \\approx ${V}`, right: "" }
        ], { dataExtra: { K, p, N } });
    }
    if (sub === "auto") {
      const K = choice([18000, 20000, 24000, 30000]), p = choice([10, 12, 15, 20]);
      const b = 1 - p / 100, W3 = roundKfm(K * Math.pow(b, 3), 0), k = ersteSchritte(1, b, 0.5, false);
      return textTask("exponentialrechnung", 6, "auto",
        T(`Ein neues Auto kostet ${tausender(K)} €. Es verliert jedes Jahr ${p} % seines Wertes vom Vorjahr. ${n} überlegt, es nach ein paar Jahren wieder zu verkaufen.`),
        T("Was ist das Auto nach 3 Jahren noch wert? Nach wie vielen Jahren ist es erstmals weniger als die Hälfte wert?"), [
          { label: "Wert nach 3 Jahren in € (ganze Euro)", kind: "number", answer: W3, tol: 1 },
          { label: "Jahre bis unter die Hälfte", kind: "number", answer: k }
        ], [
          { label: "Abnahmefaktor" }, { left: `1 - \\dfrac{${p}}{100} = ${fmtNum(round2(b))}`, right: "" },
          { label: "Wert nach 3 Jahren" }, { left: `${K}\\cdot ${fmtNum(round2(b))}^{3} \\approx ${W3}`, right: "" }
        ].concat(logSchritte(b, 0.5, ["Jahr", "Jahren"], k, false)), { dataExtra: { K, p } });
    }
    if (sub === "medikament") {
      const D = choice([200, 400, 500, 800]), p = choice([10, 15, 20, 25, 30]), f = choice([0.25, 0.3, 0.4]);
      const G = D * f, b = 1 - p / 100, k = ersteSchritte(1, b, f, false);
      return textTask("exponentialrechnung", 6, "medikament",
        T(`Nach der Einnahme einer Tablette sind ${D} mg Wirkstoff im Blut. Der Körper baut jede Stunde ${p} % der noch vorhandenen Menge ab. Laut Beipackzettel darf man die nächste Tablette erst nehmen, wenn weniger als ${fmtNum(G)} mg im Blut sind.`),
        T("Nach wie vielen Stunden darf man frühestens die nächste Tablette nehmen?"), [
          { label: "Anzahl Stunden", kind: "number", answer: k }
        ], [{ label: `Grenze : Anfangsmenge = ${fmtNum(G)} : ${D} = ${fmtNum(f)}` }].concat(logSchritte(b, f, ["Stunde", "Stunden"], k, false)),
        { dataExtra: { D, p, G } });
    }
    if (sub === "follower") {
      let F0, p, f, b, k;
      do { F0 = choice([800, 1200, 2000, 2500]); p = choice([5, 8, 10, 12, 15]); f = choice([2, 3, 4]); b = 1 + p / 100; k = ersteSchritte(1, b, f, true); } while (k > 30);
      return textTask("exponentialrechnung", 6, "follower",
        T(`${genitiv(n)} Kochkanal hat ${tausender(F0)} Follower. Seit Monaten kommen jede Woche etwa ${p} % dazu. Ab ${tausender(F0 * f)} Followern bekommt ${n} eine Einladung zu einer Messe.`),
        T("Nach wie vielen Wochen ist es voraussichtlich so weit, wenn das Wachstum so bleibt?"), [
          { label: "Anzahl Wochen", kind: "number", answer: k }
        ], [{ label: `Ziel : Start = ${tausender(F0 * f)} : ${tausender(F0)} = ${f}` }].concat(logSchritte(b, f, ["Woche", "Wochen"], k, true)),
        { dataExtra: { F0, p, Z: F0 * f } });
    }
    if (sub === "stadt") {
      const P0 = choice([24000, 36000, 48000, 60000, 85000]), p = choice([0.5, 0.8, 1, 1.2, 1.5]), N = randInt(5, 15);
      const P = roundKfm(P0 * Math.pow(1 - p / 100, N) / 100, 0) * 100;
      return textTask("exponentialrechnung", 6, "stadt",
        T(`Eine Kleinstadt hat ${tausender(P0)} Einwohner. Weil viele junge Leute wegziehen, schrumpft sie jedes Jahr um ${fmtNum(p)} %. Für die Planung einer neuen Schule will die Stadt wissen, wie viele Menschen in ${N} Jahren noch dort wohnen.`),
        T(`Wie viele Einwohner hat die Stadt in ${N} Jahren voraussichtlich? (auf Hunderter runden)`), [
          { label: "Einwohner (auf Hunderter)", kind: "number", answer: P, tol: 0.5 }
        ], [
          { label: "Abnahmefaktor" }, { left: `1 - \\dfrac{${fmtNum(p)}}{100} = ${fmtNum(round4(1 - p / 100))}`, right: "" },
          { label: "Einwohner = heute · Faktor^Jahre" }, { left: `${P0}\\cdot ${fmtNum(round4(1 - p / 100))}^{${N}} \\approx ${P}`, right: "" }
        ], { dataExtra: { P0, p, N } });
    }
    if (sub === "rendite") {
      const K = choice([2000, 5000, 8000, 10000]), p = choice([2, 3, 4, 5, 6]), N = randInt(4, 10);
      const E = roundKfm(K * Math.pow(1 + p / 100, N), 0);
      const r = round2((Math.pow(E / K, 1 / N) - 1) * 100);
      const vergleich = p + choice([-1.5, -1, -0.5, 0.5, 1, 1.5]);
      return textTask("exponentialrechnung", 6, "rendite",
        T(`${n} hat vor ${N} Jahren ${tausender(K)} € in einen Fonds gesteckt. Heute ist die Anlage ${tausender(E)} € wert. Ein Bekannter prahlt, sein Sparplan bringe ${fmtNum(vergleich)} % pro Jahr.`),
        T(`Wie viel Prozent hat ${genitiv(n)} Anlage durchschnittlich pro Jahr gebracht? War sie besser als der Sparplan?`), [
          { label: "Rendite pro Jahr in % (2 Nachkommastellen)", kind: "number", answer: r, tol: 0.05 },
          { label: "Besser als der Sparplan?", kind: "choice", choices: ["ja", "nein"], answer: r > vergleich ? "ja" : "nein" }
        ], [
          { label: "Endwert = Startwert · Faktor^Jahre, also Faktor = n-te Wurzel aus (Endwert : Startwert)" },
          { left: `\\sqrt[${N}]{${E} : ${K}} \\approx ${fmtNum(round4(Math.pow(E / K, 1 / N)))}`, right: "" },
          { label: "Rendite = (Faktor − 1) · 100" },
          { left: T(`≈ ${fmtNum(r)} % pro Jahr`), right: "" }
        ], { dataExtra: { K, E, N, vergleich } });
    }
    // seerose
    const A0 = choice([2, 3, 5, 10]), p = choice([5, 8, 10, 12, 15, 20, 25]), teich = A0 * choice([4, 5, 8, 10]);
    const b = 1 + p / 100, f = teich / A0, k = ersteSchritte(1, b, f, true);
    return textTask("exponentialrechnung", 6, "seerose",
      T(`Seerosen bedecken ${A0} m² eines ${teich} m² großen Gartenteichs. Die bedeckte Fläche wächst jede Woche um ${p} %. Ist der Teich ganz zugewachsen, bekommen die Fische zu wenig Licht.`),
      T("Nach wie vielen Wochen ist der Teich rechnerisch erstmals ganz bedeckt, wenn niemand eingreift?"), [
        { label: "Anzahl Wochen", kind: "number", answer: k }
      ], [{ label: `Teich : bedeckte Fläche = ${teich} : ${A0} = ${fmtNum(f)}` }].concat(logSchritte(b, f, ["Woche", "Wochen"], k, true)),
      { dataExtra: { A0, p, teich } });
  }

  // ---- Stufe 7: Halbwertszeit und Verdopplungszeit (Vorbild: Grundwissen Kl. 10, Lambacher Schweizer) ----

  // ---- Stufe 1: Steigung aus zwei Punkten berechnen (Kl. 7-8) ----
  function gen_linear_1() {
    const x1 = randInt(-6, 6);
    const y1 = randInt(-6, 6);
    let dx = randInt(-6, 6);
    while (dx === 0) dx = randInt(-6, 6);
    const dy = randInt(-10, 10);
    const x2 = x1 + dx;
    const y2 = y1 + dy;
    const g = gcd(dy, dx) || 1;
    const num = dy / g, den = dx / g;
    // Vorzeichen vereinheitlichen: Nenner immer positiv
    const answer = den < 0 ? { num: -num, den: -den } : { num, den };
    return {
      topic: "lineare_funktionen", level: 1,
      prompt: `P(${x1}\\,|\\,${y1})\\,, \\; Q(${x2}\\,|\\,${y2})`,
      promptText: `P(${x1}|${y1}), Q(${x2}|${y2})`,
      question: `m = \\;?`,
      questionText: `Steigung m = ?`,
      numFields: 1,
      fieldLabels: ["m (Bruch oder Zahl, z. B. 3/4)"],
      answerType: "fraction",
      answer: [answer],
      data: { x1, y1, x2, y2, dx, dy }
    };
  }
  function check_linear_1(task, userInputs) {
    const f = parseUserFraction(userInputs[0]);
    if (!f) return { correct: false, fieldErrors: [0] };
    const ok = fractionsEqual(f, task.answer[0]);
    return { correct: ok, fieldErrors: ok ? [] : [0] };
  }
  function steps_linear_1(task) {
    const { x1, y1, x2, y2, dx, dy } = task.data;
    return [
      { left: `m = \\dfrac{y_2-y_1}{x_2-x_1}`, right: "Formel" },
      { left: `m = \\dfrac{${y2}-(${y1})}{${x2}-(${x1})}`, right: "einsetzen" },
      { left: `m = \\dfrac{${dy}}{${dx}}`, right: "" }
    ];
  }

  // ---- Stufe 2: Geradengleichung aufstellen (Kl. 7-8) ----
  function gen_linear_2() {
    let m = randInt(-5, 5);

    const b = randInt(-10, 10);

    let x2 = randInt(-5, 5);

      topic: "lineare_funktionen", level: 2,

  // ---- Stufe 3: Parallelität & Orthogonalität (Kl. 8) ----
  function gen_linear_3() {
    let m1 = randInt(-6, 6);
    while (m1 === 0) m1 = randInt(-6, 6);
    const subtype = choice(["parallel", "ortho"]);
    const answer = subtype === "parallel" ? { num: m1, den: 1 } : { num: -1, den: m1 };
    return {
      topic: "lineare_funktionen", level: 3, subtype,
      prompt: subtype === "parallel"
        ? `\\text{Gerade }g\\text{ mit }m_1 = ${m1}\\text{, gesucht: Steigung einer Parallelen}`
        : `\\text{Gerade }g\\text{ mit }m_1 = ${m1}\\text{, gesucht: Steigung einer Senkrechten}`,
      promptText: subtype === "parallel" ? `g: m1=${m1}, Steigung einer Parallelen?` : `g: m1=${m1}, Steigung einer Senkrechten?`,
      numFields: 1,

      answer: [answer],
      data: { m1 }

  function check_linear_3(task, userInputs) {

    return { correct: ok, fieldErrors: ok ? [] : [0] };
  }
  function steps_linear_3(task) {
    const { m1 } = task.data;
    if (task.subtype === "parallel") {
      return [
        { left: `\\text{Parallele Geraden haben dieselbe Steigung}`, right: "" },
        { left: `m = m_1 = ${m1}`, right: "" }

    }
    return [
      { left: `m_1\\cdot m_2 = -1`, right: "Orthogonalitätsbedingung" },
      { left: `m_2 = -\\dfrac{1}{m_1} = -\\dfrac{1}{${m1}}`, right: "" }
    ];
  }

  // ---- Stufe 4: Schnittpunkt zweier Geraden (Kl. 8-9) ----
  function gen_linear_4() {
    const xT = randInt(-5, 5);
    let m1 = randInt(-4, 4);
    while (m1 === 0) m1 = randInt(-4, 4);
    let m2 = randInt(-4, 4);
    while (m2 === 0 || m2 === m1) m2 = randInt(-4, 4);
    const b1 = randInt(-8, 8);

    const yT = m1 * xT + b1;
    return {
      topic: "lineare_funktionen", level: 4,
      prompt: `f(x) = ${coefX(m1)} ${b1 >= 0 ? "+" : "-"} ${Math.abs(b1)}\\,, \\quad g(x) = ${coefX(m2)} ${b2 >= 0 ? "+" : "-"} ${Math.abs(b2)}`,

      numFields: 2,

      answer: [xT, yT],
      data: { m1, m2, b1, b2, xT, yT }
    };
  }

  }
  function steps_linear_4(task) {
    const { m1, m2, b1, b2, xT, yT } = task.data;
    return [
      { left: `${coefX(m1)} ${b1 >= 0 ? "+" : "-"} ${Math.abs(b1)} = ${coefX(m2)} ${b2 >= 0 ? "+" : "-"} ${Math.abs(b2)}`, right: "Gleichsetzen" },

  }

  // Primfaktorzerlegung als {Primzahl: Exponent}-Objekt
  function primeFactorize(n) {
    const factors = {};
    let d = 2;
    while (n > 1) {
      while (n % d === 0) { factors[d] = (factors[d] || 0) + 1; n = n / d; }
      d++;
      if (d * d > n && n > 1) { factors[n] = (factors[n] || 0) + 1; break; }
    }
    return factors;
  }
  function factorsToTerm(factors) {
    return Object.keys(factors).map((p) => (factors[p] > 1 ? `${p}^{${factors[p]}}` : `${p}`)).join("\\cdot ");
  }
  function lcmViaFactors(b, d) {
    const fb = primeFactorize(b), fd = primeFactorize(d);
    const allPrimes = new Set([...Object.keys(fb), ...Object.keys(fd)]);
    const lcmFactors = {};
    let lcm = 1;
    allPrimes.forEach((p) => {
      const e = Math.max(fb[p] || 0, fd[p] || 0);
      lcmFactors[p] = e;
      lcm *= Math.pow(Number(p), e);
    });
    return { lcm, fb, fd, lcmFactors };
  }

  // ---- Spiel 1: "Was ist größer?" -- gleicher Nenner XOR gleicher Zähler ----
  // Sonderfall "gleichwertig": ein Bruch ist die mit 2-5 erweiterte Form des
  // anderen (z.B. 3/5 und 9/15) -- so sehen gleiche Brüche nie identisch aus.
  function gen_brueche_1() {
    let mode = Math.random() < 0.2 ? "expanded" : choice(["sameDenom", "sameNum"]);
    let a, b, c, d, cmp, k = null;
    if (mode === "expanded") {
      const baseNum = randInt(1, 9), baseDen = randInt(2, 9);
      k = randInt(2, 5);
      if (Math.random() < 0.5) { a = baseNum; b = baseDen; c = baseNum * k; d = baseDen * k; }
      else { a = baseNum * k; b = baseDen * k; c = baseNum; d = baseDen; }
      cmp = "=";
    } else if (mode === "sameDenom") {
      b = d = randInt(2, 12);
      a = randInt(1, 15);
      do { c = randInt(1, 15); } while (c === a);
      cmp = a > c ? ">" : "<";
    } else {
      a = c = randInt(1, 12);
      b = randInt(2, 15);
      do { d = randInt(2, 15); } while (d === b);
      cmp = b < d ? ">" : "<"; // gleicher Zähler: kleinerer Nenner = größerer Bruch
    }
    return {
      topic: "brueche", level: 1, subtype: mode,
      prompt: `\\dfrac{${a}}{${b}} \\;\\;\\square\\;\\; \\dfrac{${c}}{${d}}`,

      fieldChoices: [["<", "=", ">"]],

    };
  }

  function steps_brueche_1(task) {

  // ---- Spiel 2: ungleichnamige Brüche -- kgV per Primfaktorzerlegung, dann vergleichen ----

  const BRUECHE2_DENOMS = [2, 3, 4, 6, 8, 9, 10, 12, 14, 15, 18, 20, 21, 24];
  function gen_brueche_2() {
    let b, d, a, c;

  // ---- Spiel 3: Brüche kürzen mit dem ggT ----

      for (let p = 1; p < q; p++) if (gcd(p, q) === 1 && p / q >= min && p / q <= max) kand.push([p, q]);
    }
    return kand.length ? choice(kand) : null;
  }

  function gen_brueche_4() {
    if (Math.random() < 0.6) {
      // ---------- Vergleich zweier Anteile ----------
      const V = choice(VERGLEICHE_BR);
      const c = V.setup();
      const wantEqual = Math.random() < 0.15;
      let s, f;
      for (let tries = 0; tries < 500; tries++) {
        const b1 = choice(V.w); let b2; do { b2 = choice(V.w); } while (b2 === b1);
        let f1, f2;
        if (wantEqual) {
          f1 = anteilFuer(b1, V.maxQ, V.min, V.max, b2);
          if (!f1) continue;
          f2 = f1;
        } else {
          f1 = anteilFuer(b1, V.maxQ, V.min, V.max); f2 = anteilFuer(b2, V.maxQ, V.min, V.max);
          if (!f1 || !f2 || f1[0] * f2[1] === f2[0] * f1[1]) continue;
        }
        const zeig = (b, fr) => { const rel = (b / fr[1]) * fr[0]; return { b, rel, a: V.rest ? b - rel : rel }; };
        s = [zeig(b1, f1), zeig(b2, f2)]; f = [f1, f2];
        if (s.some((x) => x.a < 1 || x.b - x.a < 1)) { s = null; continue; }
        break;
      }
      const diff = f[0][0] * f[1][1] - f[1][0] * f[0][1]; // >0: erster Anteil größer
      const sieger = diff === 0 ? null : (V.besser === "weniger" ? (diff < 0 ? 0 : 1) : (diff > 0 ? 0 : 1));
      const choices = [c.e[0], V.gleich, c.e[1]];
      const antwort = sieger === null ? V.gleich : c.e[sieger];
      const steps = [];
      if (V.rennen) steps.push({ label: HINWEIS_RENNEN });
      steps.push({ label: V.rest ? "Gesucht ist der freie Rest: Ganzes minus belegt" : "Anteil = Teil : Ganzes, dann kürzen" });
      [0, 1].forEach((i) => {
        if (V.extra) steps.push(V.extra(c, s, i));
        if (V.rest) steps.push({ left: `${T(c.e[i] + ": ")}${s[i].b} - ${s[i].a} = ${s[i].rel}`, right: "" });
        steps.push(kuerzZeile(T(c.e[i] + ": "), s[i].rel, s[i].b));
      });
      const [p1, q1] = f[0], [p2, q2] = f[1];
      const cmp = diff > 0 ? ">" : diff < 0 ? "<" : "=";
      if (q1 === q2) {
        steps.push({ label: "Gleicher Nenner: Zähler vergleichen" }, { left: `\\dfrac{${p1}}{${q1}} ${cmp} \\dfrac{${p2}}{${q2}}`, right: "" });
      } else {
        const L = (q1 * q2) / gcd(q1, q2);
        steps.push({ label: `Gleichnamig machen: kgV von ${q1} und ${q2} ist ${L}` },
          { left: `\\dfrac{${p1}}{${q1}} = \\dfrac{${p1 * L / q1}}{${L}}\\,, \\quad \\dfrac{${p2}}{${q2}} = \\dfrac{${p2 * L / q2}}{${L}}`, right: "" },
          { left: `\\dfrac{${p1 * L / q1}}{${L}} ${cmp} \\dfrac{${p2 * L / q2}}{${L}}`, right: "" });
      }
      if (V.besser === "weniger") steps.push({ label: "Hier ist der kleinere Anteil der bessere." });
      steps.push({ label: "Antwort" }, { left: T(V.satz(c, sieger)), right: "" });
      return textTask("brueche", 4, "vergleich:" + V.key, T(V.text(c, s)), T(V.frage(c)), [
        { label: V.feld(c, 0) + " (gekürzt)", kind: "fraction", answer: { num: p1, den: q1 } },
        { label: V.feld(c, 1) + " (gekürzt)", kind: "fraction", answer: { num: p2, den: q2 } },
        { label: V.frage(c), kind: "choice", choices, answer: antwort }
      ], steps, { dataExtra: { kind: "vergleich", key: V.key, rest: !!V.rest, besser: V.besser || "mehr", ganzesVersteckt: !!V.ganzesVersteckt, s, choices } });
    }

    // ---------- Einzelner Anteil (vollständig gekürzt) ----------
    const n = choice(NAMEN);
    if (Math.random() < 0.12) {
      // Fußball: Niederlagen erst ausrechnen
      let b, lost, w, u;
      do {
        b = choice([20, 24, 30, 32, 36]);
        const fr = anteilFuer(b, 10, 0.1, 0.5);
        lost = (b / fr[1]) * fr[0];
        const rest = b - lost;
        w = randInt(1, rest - 1); u = rest - w;
      } while (u < 1 || w < 1);
      const g = gcd(lost, b);
      const steps = [
        { label: "Niederlagen = alle Spiele minus Siege minus Unentschieden" },
        { left: `${b} - ${w} - ${u} = ${lost}`, right: "" },
        { label: "Anteil = Niederlagen : alle Spiele, dann kürzen" },
        kuerzZeile("", lost, b)
      ];
      return textTask("brueche", 4, "anteil:fussball",
        T(`Ein Fußballverein hat in der Saison ${b} Spiele bestritten: ${anz(w, "Sieg", "Siege")}, ${anz(u, "Unentschieden", "Unentschieden")}, der Rest waren Niederlagen.`),
        T("Welcher Anteil der Spiele ging verloren? Gib ihn vollständig gekürzt an."), [
          { label: "Anteil der Niederlagen (gekürzt)", kind: "fraction", answer: { num: lost / g, den: b / g } }
        ], steps, { dataExtra: { kind: "fussball", b, w, u } });
    }
    const A = choice(ANTEILE_BR);
    let b, a, rel;
    for (let tries = 0; tries < 200; tries++) {
      b = choice(A.ganz);
      if (A.zeigen) { a = choice(A.zeigen); rel = A.rest ? b - a : a; }
      else { const fr = anteilFuer(b, A.maxQ, A.min, A.max); if (!fr) continue; rel = (b / fr[1]) * fr[0]; a = A.rest ? b - rel : rel; }
      if (a >= 1 && rel >= 1 && rel < b) break;
    }
    const g = gcd(rel, b);
    const steps = [];
    if (A.hinweis) steps.push({ label: A.hinweis });
    if (A.rest) steps.push({ label: "Gesucht ist der Rest: Ganzes minus verbraucht" }, { left: `${b} - ${a} = ${rel}`, right: "" });
    steps.push({ label: "Anteil = Teil : Ganzes, dann kürzen" }, kuerzZeile("", rel, b));
    return textTask("brueche", 4, "anteil:" + A.key, T(A.text(n, a, b)), T(A.frage(n) + " Gib ihn vollständig gekürzt an."), [
      { label: "Anteil (vollständig gekürzt)", kind: "fraction", answer: { num: rel / g, den: b / g } }
    ], steps, { dataExtra: { kind: "anteil", key: A.key, a, b, rest: !!A.rest } });
  }

  // Bruchrechnung erweitert (Recherche: echte Kl.-6-Arbeiten enthalten gemischte

  const fr = (n, d) => { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d) || 1; return { num: n / g, den: d / g }; };
  const frTex = (n, d) => (d === 1 ? `${n}` : `\\dfrac{${n}}{${d}}`);
  const gemTex = (g, n, d) => (n === 0 ? `${g}` : g === 0 ? `\\dfrac{${n}}{${d}}` : `${g}\\tfracSPACE\\dfrac{${n}}{${d}}`.replace("\\tfracSPACE", "\\,"));
  function echterBruch(maxN) { let n, d; do { d = randInt(2, maxN || 9); n = randInt(1, d - 1); } while (gcd(n, d) !== 1); return [n, d]; }
  function check_bruch_streng(task, inp) { // vollständig gekürzt verlangt (Fraktionsfelder), Zahlenfelder exakt

        perFieldType: ["text", "choice"], fieldChoices: [null, ["0", "1", "2"]], answer: [D, D > 0 ? "2" : D === 0 ? "1" : "0"], data: { a, b, c, D } };

  }

    if (o.ecken !== false) ["A", "B", "C"].forEach((k) => {
