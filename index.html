<script>
// ============================================================
// App-Schicht: Ansichten, Speicherung, Statistik, Interaktion.
// ============================================================
(function () {
  "use strict";
  const ML = window.MathLogic;
  const STATS_KEY = "mathe-uebungstool-stats";

  // ---------- Speicher-Abstraktion: window.storage -> localStorage -> Session ----------
  let storageMode = null; // "window" | "local" | "memory"
  let statsCache = {};

  async function initStorage() {
    if (typeof window.storage !== "undefined" && window.storage && typeof window.storage.get === "function") {
      try {
        const res = await window.storage.get(STATS_KEY, false);
        storageMode = "window";
        statsCache = (res && res.value) ? JSON.parse(res.value) : {};
        return;
      } catch (e) {
        storageMode = "window";
        statsCache = {};
        return;
      }
    }
    try {
      const testKey = "__mathe_uebungstool_test__";
      localStorage.setItem(testKey, "1");
      localStorage.removeItem(testKey);
      storageMode = "local";
      const raw = localStorage.getItem(STATS_KEY);
      statsCache = raw ? JSON.parse(raw) : {};
      return;
    } catch (e) {
      storageMode = "memory";
      statsCache = {};
    }
  }

  async function persistStats() {
    if (storageMode === "window") {
      try {
        await window.storage.set(STATS_KEY, JSON.stringify(statsCache), false);
        return;
      } catch (e) {
        storageMode = "local";
      }
    }
    if (storageMode === "local") {
      try {
        localStorage.setItem(STATS_KEY, JSON.stringify(statsCache));
        return;
      } catch (e) {
        storageMode = "memory";
      }
    }
  }

  function statKey(topicKey, levelId) { return `${topicKey}-${levelId}`; }
  function getStat(topicKey, levelId) {
    const k = statKey(topicKey, levelId);
    return statsCache[k] || { attempts: 0, correct: 0 };
  }
  // punkte: 1 = ohne Hilfe richtig, 0.5 = mit Tipp richtig, 0 = falsch / Rechenweg gebraucht
  function recordAttempt(topicKey, levelId, wasCorrect, punkte) {
    const k = statKey(topicKey, levelId);
    const s = statsCache[k] || { attempts: 0, correct: 0 };
    s.attempts += 1;
    if (wasCorrect) s.correct += 1;
    s.recent = (s.recent || []).concat([punkte === undefined ? (wasCorrect ? 1 : 0) : punkte]).slice(-10);
    statsCache[k] = s;
    persistStats();
  }
  // "Sitzt": mindestens 8 von 10 Punkten in den letzten 10 Aufgaben
  function stufeSitzt(s) {
    const r = s.recent || [];
    return r.length >= 10 && r.reduce((a, b) => a + b, 0) >= 8;
  }

  // ---------- Wiederholung falsch gelöster Aufgabentypen ----------
  const REVIEW_KEY = "__wiederholen";
  function reviewMap() { return statsCache[REVIEW_KEY] || (statsCache[REVIEW_KEY] = {}); }
  function typVon(task) { return task && task.subtype ? String(task.subtype) : null; }
  function merkeWiederholung(topicKey, levelId, task) {
    const typ = typVon(task); if (!typ) return;
    const m = reviewMap(), k = statKey(topicKey, levelId);
    m[k] = m[k] || {};
    m[k][typ] = Math.min(3, (m[k][typ] || 0) + 1); // höchstens 3 Wiederholungen offen
    persistStats();
  }
  function wiederholungGeschafft(topicKey, levelId, task) {
    const typ = typVon(task); if (!typ) return;
    const m = reviewMap(), k = statKey(topicKey, levelId);
    if (!m[k] || !m[k][typ]) return;
    m[k][typ] -= 1;
    if (m[k][typ] <= 0) delete m[k][typ];
    if (!Object.keys(m[k]).length) delete m[k];
    persistStats();
  }
  function anzahlWiederholung(topicKey, levelId) {
    const e = reviewMap()[statKey(topicKey, levelId)];
    return e ? Object.keys(e).length : 0;
  }
  // Neue Aufgabe: in jeder 2. Aufgabe wird (falls vorgemerkt) gezielt ein
  // zuletzt nicht geschaffter Aufgabentyp ausgewählt.
  function erzeugeAufgabe(topicKey, level) {
    const e = reviewMap()[statKey(topicKey, level.id)];
    if (e && Object.keys(e).length && Math.random() < 0.5) {
      const gesucht = new Set(Object.keys(e));
      for (let i = 0; i < 80; i++) {
        const t = level.generate();
        if (gesucht.has(typVon(t))) { t._wiederholung = true; return t; }
      }
    }
    return level.generate();
  }

  // ---------- App-Zustand ----------
  const state = { view: "home", topicKey: null, levelId: null, task: null, checked: false, showSteps: false, stepsRevealed: false };

  const app = document.getElementById("app");

  function el(tag, attrs, children) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    if (children) children.forEach(c => { if (c) e.appendChild(c); });
    return e;
  }
  function text(tag, cls, str) { return el(tag, { class: cls }, [document.createTextNode(str)]); }

  // ---------- Rendering: Startseite ----------
  function renderHome() {
    app.innerHTML = "";
    app.appendChild(el("header", { class: "topbar" }, [
      text("h1", "", "Mathe-Übungstool")
    ]));
    app.appendChild(text("p", "subtitle", "Wähle ein Thema, dann eine Schwierigkeitsstufe. Kein Zeitdruck -- deine Statistik pro Thema wird gespeichert."));

    if (storageMode === "memory") {
      app.appendChild(el("div", { class: "storage-banner" }, [
        document.createTextNode("Hinweis: Dein Browser erlaubt in diesem Kontext keine dauerhafte Speicherung (z. B. beim Öffnen per Doppelklick in manchen Browsern). Deine Statistik gilt nur für diese Sitzung und geht beim Schließen verloren.")
      ]));
    }

    const grid = el("div", { class: "grid" });
    Object.keys(ML.TOPICS).forEach(topicKey => {
      const topic = ML.TOPICS[topicKey];
      let attempts = 0, correct = 0;
      topic.levels.forEach(lvl => { const s = getStat(topicKey, lvl.id); attempts += s.attempts; correct += s.correct; });
      const tile = el("button", { class: "tile", onclick: () => { state.topicKey = topicKey; state.view = "levels"; render(); } }, [
        el("span", { class: "badge" }, [document.createTextNode(topic.grade)]),
        text("h3", "", topic.name),
        text("p", "", topic.levels.length + " Schwierigkeitsstufen"),
      ]);
      const statLine = el("div", { class: "stat-line" }, [
        el("span", { class: "dot" + (attempts > 0 ? " has-data" : "") }),
        document.createTextNode(attempts > 0 ? `${correct}/${attempts} richtig gesamt` : "Noch nicht geübt")
      ]);
      tile.appendChild(statLine);
      grid.appendChild(tile);
    });
    app.appendChild(grid);
    app.appendChild(lernstandKarte());

    app.appendChild(el("footer", { class: "hint" }, [
      document.createTextNode("Alle Aufgaben werden im Browser erzeugt -- keine Internetverbindung nötig.")
    ]));
  }

  // ---------- Rendering: Stufenauswahl ----------
  function renderLevels() {
    const topic = ML.TOPICS[state.topicKey];
    app.innerHTML = "";
    app.appendChild(el("header", { class: "topbar" }, [
      el("button", { class: "backbtn", onclick: () => { state.view = "home"; render(); } }, [document.createTextNode("←")]),
      text("h1", "", topic.name)
    ]));
    app.appendChild(text("p", "subtitle", topic.grade));

    const grid = el("div", { class: "grid" });
    topic.levels.forEach(lvl => {
      const s = getStat(state.topicKey, lvl.id);
      const pct = s.attempts > 0 ? Math.round((s.correct / s.attempts) * 100) : null;
      const tile = el("button", { class: "tile", onclick: () => {
        state.levelId = lvl.id; state.view = "task"; state.checked = false; state.showSteps = false; state.stepsRevealed = false; state.tipsShown = 0;
        state.task = erzeugeAufgabe(state.topicKey, topic.levels.find(l => l.id === lvl.id));
        render();
      } }, [
        el("span", { class: "badge" }, [document.createTextNode(lvl.grade)]),
        text("h3", "", lvl.name),
      ]);
      const statLine = el("div", { class: "stat-line" }, [
        el("span", { class: "dot" + (s.attempts > 0 ? " has-data" : "") }),
        document.createTextNode(s.attempts > 0 ? `${s.correct}/${s.attempts} richtig (${pct}\u202F%)` : "Noch nicht geübt")
      ]);
      tile.appendChild(statLine);
      const nW = anzahlWiederholung(state.topicKey, lvl.id);
      if (stufeSitzt(s)) tile.appendChild(text("div", "tile-mark ok", "✓ sitzt"));
      if (nW) tile.appendChild(text("div", "tile-mark wdh", `🔁 ${nW} ${nW === 1 ? "Aufgabentyp" : "Aufgabentypen"} zum Wiederholen`));
      grid.appendChild(tile);
    });
    app.appendChild(grid);
    const letzte = statsCache[klausurKey(state.topicKey)];
    const kaBox = el("div", { class: "card exam-entry" }, [
      text("h3", "", "📝 Klassenarbeit üben"),
      text("div", "exam-small", "Wie eine echte Arbeit: Aufgaben mit Teilaufgaben, mit und ohne Taschenrechner, auch Begründen und Fehler finden. Am Ende alle Lösungen mit Musterzeichnungen."),
    ]);
    if (letzte) kaBox.appendChild(text("div", "exam-small", `Letztes Ergebnis: Note ${letzte.note} (${letzte.punkte} von ${letzte.gesamt} Punkten, ${letzte.datum.split("-").reverse().join(".")})`));
    kaBox.appendChild(el("div", { class: "btn-row" }, [el("button", { class: "btn", onclick: () => { state.view = "exam-setup"; render(); } }, [document.createTextNode("Klassenarbeit einrichten")])]));
    app.appendChild(kaBox);
  }

  // ---------- Lernstand sichern und übertragen (ohne Server, alles lokal) ----------
  // Format: { app: "mathe-uebungstool", version: 1, erstellt: ISO-Datum, lernstand: <statsCache> }
  const LS_APP = "mathe-uebungstool", LS_VERSION = 1;
  function lernstandJSON() {
    return JSON.stringify({ app: LS_APP, version: LS_VERSION, erstellt: new Date().toISOString(), lernstand: statsCache });
  }
  function lernstandUeberblick(daten) {
    let stufen = 0, versuche = 0, arbeiten = 0;
    Object.keys(daten).forEach((k) => {
      if (k.startsWith("__klausur-")) arbeiten++;
      else if (!k.startsWith("__") && daten[k].attempts > 0) { stufen++; versuche += daten[k].attempts; }
    });
    return { stufen, versuche, arbeiten };
  }
  // Prüft eine geladene Sicherung streng – nur bekannte Einträge mit plausiblen Werten werden übernommen.
  function pruefeLernstand(text) {
    let obj;
    if (!text || text.length > 2000000) return { fehler: "Die Datei ist leer oder zu groß." };
    try { obj = JSON.parse(text); } catch (e) { return { fehler: "Das ist keine gültige Lernstand-Sicherung (kein lesbares Format)." }; }
    if (!obj || obj.app !== LS_APP || typeof obj.lernstand !== "object" || obj.lernstand === null || Array.isArray(obj.lernstand)) return { fehler: "Das ist keine Sicherung aus dem Mathe-Übungstool." };
    if (obj.version !== LS_VERSION) return { fehler: "Diese Sicherung stammt aus einer anderen Version des Tools und kann nicht geladen werden." };
    const ganz = (x, min, max) => Number.isInteger(x) && x >= min && x <= max, rein = {};
    for (const [k, v] of Object.entries(obj.lernstand)) {
      if (!v || typeof v !== "object") return { fehler: `Ungültiger Eintrag „${k}“.` };
      const m = /^([a-z_]+)-(\d+)$/.exec(k);
      if (m) {
        if (!ML.TOPICS[m[1]] || !ML.TOPICS[m[1]].levels.some((l) => l.id === +m[2])) continue; // Stufe gibt es (nicht mehr): überspringen
        if (!ganz(v.attempts, 0, 1e7) || !ganz(v.correct, 0, v.attempts)) return { fehler: `Ungültige Zahlen bei „${k}“.` };
        if (v.recent !== undefined && (!Array.isArray(v.recent) || v.recent.length > 10 || v.recent.some((p) => ![0, 0.5, 1].includes(p)))) return { fehler: `Ungültiger Verlauf bei „${k}“.` };
        rein[k] = { attempts: v.attempts, correct: v.correct }; if (v.recent) rein[k].recent = v.recent.slice();
      } else if (k === "__wiederholen") {
        const w = {};
        for (const [stufe, typen] of Object.entries(v)) {
          if (!/^[a-z_]+-\d+$/.test(stufe) || !typen || typeof typen !== "object") return { fehler: "Ungültige Wiederholungsliste." };
          for (const [typ, n] of Object.entries(typen)) { if (!ganz(n, 1, 3) || typ.length > 60) return { fehler: "Ungültige Wiederholungsliste." }; (w[stufe] = w[stufe] || {})[typ] = n; }
        }
        rein[k] = w;
      } else if (k.startsWith("__klausur-")) {
        if (!ML.TOPICS[k.slice(10)]) continue;
        if (!ganz(v.note, 1, 6) || typeof v.pct !== "number" || v.pct < 0 || v.pct > 100 || !/^\d{4}-\d{2}-\d{2}$/.test(String(v.datum))) return { fehler: `Ungültiges Klassenarbeits-Ergebnis „${k}“.` };
        rein[k] = { pct: v.pct, note: v.note, punkte: Number(v.punkte) || 0, gesamt: Number(v.gesamt) || 0, datum: v.datum };
      }
      // unbekannte Einträge werden ignoriert
    }
    return { daten: rein, erstellt: typeof obj.erstellt === "string" ? obj.erstellt.slice(0, 10) : "?" };
  }
  const anzahl = (n, ein, mehr) => `${n} ${n === 1 ? ein : mehr}`;
  function datumDE(iso) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ""); return m ? `${m[3]}.${m[2]}.${m[1]}` : iso; }
  function lernstandUebernehmen(text, meldung) {
    const r = pruefeLernstand(text);
    if (r.fehler) { meldung(r.fehler, true); return; }
    const neu = lernstandUeberblick(r.daten), alt = lernstandUeberblick(statsCache);
    const frage = `Lernstand vom ${datumDE(r.erstellt)} laden?\n\nDarin: ${anzahl(neu.versuche, "gelöste Aufgabe", "gelöste Aufgaben")} in ${anzahl(neu.stufen, "Stufe", "Stufen")}, ${anzahl(neu.arbeiten, "Klassenarbeits-Ergebnis", "Klassenarbeits-Ergebnisse")}.\n\n` +
      (alt.versuche || alt.arbeiten ? `Achtung: Dein jetziger Lernstand (${anzahl(alt.versuche, "Aufgabe", "Aufgaben")}, ${anzahl(alt.arbeiten, "Klassenarbeits-Ergebnis", "Klassenarbeits-Ergebnisse")}) wird dabei ersetzt.` : "Auf diesem Gerät ist noch kein Lernstand gespeichert.");
    if (!window.confirm(frage)) { meldung("Laden abgebrochen – nichts wurde verändert.", false); return; }
    statsCache = r.daten; persistStats();
    meldung(`Lernstand geladen: ${anzahl(neu.versuche, "Aufgabe", "Aufgaben")} in ${anzahl(neu.stufen, "Stufe", "Stufen")}.`, false);
    setTimeout(render, 900);
  }
  function lernstandKarte() {
    const karte = el("details", { class: "lernstand" }), status = el("div", { class: "ls-status" });
    const meldung = (t, fehler) => { status.textContent = t; status.className = "ls-status" + (fehler ? " ls-fehler" : " ls-ok"); };
    karte.appendChild(el("summary", {}, [document.createTextNode("💾 Lernstand sichern oder auf ein anderes Gerät übertragen")]));
    karte.appendChild(text("p", "ls-text", "Dein Fortschritt wird nur in diesem Browser gespeichert. Sichere ihn als Datei oder Text und lade ihn auf einem anderen Gerät wieder – ohne Konto, nichts wird ins Internet geschickt."));
    const ue = lernstandUeberblick(statsCache);
    karte.appendChild(text("p", "ls-text", `Aktuell gespeichert: ${anzahl(ue.versuche, "gelöste Aufgabe", "gelöste Aufgaben")} in ${anzahl(ue.stufen, "Stufe", "Stufen")}, ${anzahl(ue.arbeiten, "Klassenarbeits-Ergebnis", "Klassenarbeits-Ergebnisse")}.`));
    const knopf = (t, f, cls) => el("button", { class: "btn small " + (cls || "ghost"), type: "button", onclick: f }, [document.createTextNode(t)]);
    const datei = el("input", { type: "file", accept: ".json,application/json,text/plain", style: "display:none" });
    datei.addEventListener("change", () => { const f = datei.files && datei.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { lernstandUebernehmen(String(rd.result), meldung); datei.value = ""; }; rd.onerror = () => meldung("Die Datei konnte nicht gelesen werden.", true); rd.readAsText(f); });
    const feld = el("textarea", { class: "ls-feld", placeholder: "Gesicherten Text hier einfügen …", rows: "4", style: "display:none" });
    const laden = knopf("Eingefügten Text laden", () => lernstandUebernehmen(feld.value.trim(), meldung)); laden.style.display = "none";
    karte.appendChild(el("div", { class: "ls-knoepfe" }, [
      knopf("Als Datei sichern", () => {
        try { const url = URL.createObjectURL(new Blob([lernstandJSON()], { type: "application/json" })), a = el("a", { href: url, download: `mathe-lernstand-${new Date().toISOString().slice(0, 10)}.json` });
          document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); meldung("Datei erstellt – sie liegt in deinen Downloads.", false);
        } catch (e) { meldung("Speichern als Datei ist hier nicht möglich – nutze „Als Text kopieren“.", true); }
      }, "primary"),
      knopf("Als Text kopieren", () => {
        const t = lernstandJSON();
        const fallback = () => { feld.style.display = ""; feld.value = t; feld.select(); laden.style.display = "none"; meldung("Text unten markiert – kopiere ihn und bewahre ihn auf (z. B. in einer Notiz).", false); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => meldung("In die Zwischenablage kopiert – füge den Text z. B. in eine Notiz ein.", false), fallback); else fallback();
      }),
      knopf("Aus Datei laden", () => datei.click()),
      knopf("Aus Text laden", () => { feld.style.display = ""; feld.value = ""; laden.style.display = ""; feld.focus(); meldung("", false); })
    ]));
    karte.appendChild(datei); karte.appendChild(feld); karte.appendChild(laden); karte.appendChild(status);
    return karte;
  }

  // ---------- Rendering: Aufgabe ----------
  // Baut die Eingabefelder einer Aufgabe in 'card' und liefert die (versteckten)
  // Eingabe-Elemente zurück. 'prefix' macht die Feld-IDs eindeutig, damit auch
  // mehrere Aufgaben auf einer Seite (Klassenarbeit) funktionieren.
  function baueEingaben(task, level, card, prefix, beiEnter) {
    // Eingabefelder -- Anzahl richtet sich nach task.numFields (kann > answer.length
    // sein, damit die Feldanzahl selbst nie die Lösung verrät; bei den aktuellen
    // Stufen ist numFields stets gleich answer.length).
    const inputs = [];
    if (task.graphs && task.fieldType === "select") {
      // Graphen-Zuordnung: Raster aus SVG-Grafik + Beschriftung + Dropdown
      const grid = el("div", { class: "graph-grid" });
      task.graphs.forEach((g, idx) => {
        const fieldId = prefix + idx;
        const cell = el("div", { class: "graph-cell" });
        cell.appendChild(el("div", {
          class: "graph-svg-holder",
          html: ML.renderGraphSVG(g.fn, Object.assign({ colors: ["#2563eb"] }, task.graphConfig))
        }));
        cell.appendChild(el("label", { for: fieldId, class: "graph-label" }, [document.createTextNode(g.id)]));
        const select = el("select", { id: fieldId });
        select.appendChild(el("option", { value: "" }, [document.createTextNode("-- wählen --")]));
        task.fieldOptions.forEach((opt) => {
          select.appendChild(el("option", { value: opt.value }, [document.createTextNode(opt.text)]));
        });
        cell.appendChild(select);
        const msg = el("div", { class: "field-msg", id: fieldId + "-msg" });
        cell.appendChild(msg);
        grid.appendChild(cell);
        inputs.push(select);
      });
      card.appendChild(grid);
    } else {
      for (let idx = 0; idx < task.numFields; idx++) {
        const fieldId = prefix + idx;
        const label = (task.fieldLabels && task.fieldLabels[idx]) || `Feld ${idx + 1}`;
        // Effektiver Feldtyp: perFieldType (gemischte Aufgaben) hat Vorrang,
        // sonst der einheitliche task.fieldType (z.B. "choice" für Spiel 1),
        // sonst normales Texteingabefeld.
        const fType = (task.perFieldType && task.perFieldType[idx]) || task.fieldType || "text";
        const row = el("div", { class: "field-row" });
        row.appendChild(el("label", { for: fieldId }, [document.createTextNode(label)]));

        if (fType === "choice") {
          const choices = (task.fieldChoices && task.fieldChoices[idx]) || [];
          const hidden = el("input", { type: "hidden", id: fieldId });
          const btnGroup = el("div", { class: "choice-btn-group" });
          const buttons = [];
          choices.forEach((choiceVal) => {
            const btn = el("button", {
              type: "button", class: "choice-btn",
              onclick: () => {
                hidden.value = choiceVal;
                buttons.forEach((b) => b.classList.remove("selected"));
                btn.classList.add("selected");
              }
            }, [document.createTextNode(choiceVal)]);
            buttons.push(btn);
            btnGroup.appendChild(btn);
          });
          hidden._buttons = buttons;
          row.appendChild(btnGroup);
          row.appendChild(hidden);
          inputs.push(hidden);
        } else {
          // Handy-taugliche Eingabe: Zifferntastatur (inputmode decimal) hat
          // weder "/" noch (auf iOS) "-". Daher:
          //  - Bruchfelder: zwei Ziffernfelder übereinander (Zähler / Nenner)
          //  - alle Zahlenfelder: eigener ±-Knopf für das Vorzeichen
          // Der Prüflogik wird wie bisher ein Text ("-3/4", "2,5") übergeben.
          const ans = task.answer ? task.answer[idx] : null;
          const isFraction = task.answerType === "fraction" || (ans && typeof ans === "object" && "num" in ans);
          const hidden = el("input", { type: "hidden", id: fieldId });
          const wrap = el("div", { class: "num-input-wrap" });
          let negative = false;
          // ±-Knopf nur in Stufen, in denen negative Ergebnisse vorkommen können
          // (pro Stufe festgelegt, nicht pro Aufgabe -- sonst verriete der Knopf die Lösung)
          const wantSign = task.fieldSigned ? !!task.fieldSigned[idx] : !!level.signed;
          const signBtn = wantSign ? el("button", { type: "button", class: "sign-btn", title: "Vorzeichen wechseln", "aria-label": "Vorzeichen: plus (antippen für minus)" }, [document.createTextNode("+")]) : null;
          const onEnter = (ev) => { if (ev.key === "Enter") { ev.preventDefault(); if (beiEnter) beiEnter(); } };
          const mkInput = (cls, ph, label) => {
            const inp = el("input", { type: "text", class: cls, inputmode: "decimal", autocomplete: "off", placeholder: ph, "aria-label": label });
            inp.addEventListener("keydown", onEnter);
            return inp;
          };
          let parts;
          if (isFraction) {
            const zIn = mkInput("frac-in", "Zähler", label + " (Zähler)");
            const nIn = mkInput("frac-in", "Nenner", label + " (Nenner)");
            const fracBox = el("div", { class: "frac-input" }, [zIn, el("div", { class: "frac-bar" }), nIn]);
            parts = [zIn, nIn];
            if (signBtn) wrap.appendChild(signBtn);
            wrap.appendChild(fracBox);
            const hint = el("div", { class: "frac-hint" }, [document.createTextNode("Ganze Zahl? Nenner leer lassen.")]);
            wrap.appendChild(hint);
          } else {
            const ph = (task.fieldPlaceholders && task.fieldPlaceholders[idx] != null) ? task.fieldPlaceholders[idx] : "";
            const vIn = mkInput("num-in", ph, label);
            parts = [vIn];
            if (signBtn) wrap.appendChild(signBtn);
            wrap.appendChild(vIn);
          }
          const sync = () => {
            const strip = (s) => s.trim().replace(/^[-−]/, "");
            // Minus, das jemand direkt eintippt (z. B. am PC), zählt ebenfalls
            const typedMinus = parts.some(p => /^[-−]/.test(p.value.trim()));
            const neg = negative !== typedMinus;
            const z = strip(parts[0].value);
            let v = z;
            if (isFraction) {
              const n = strip(parts[1].value);
              if (n !== "") v = z + "/" + n;
            }
            hidden.value = v === "" ? "" : (neg ? "-" : "") + v;
            if (signBtn) {
              signBtn.classList.toggle("active", neg);
              signBtn.textContent = neg ? "−" : "+";
              signBtn.setAttribute("aria-label", neg ? "Vorzeichen: minus (antippen für plus)" : "Vorzeichen: plus (antippen für minus)");
            }
          };
          parts.forEach(p => p.addEventListener("input", sync));
          if (signBtn) signBtn.addEventListener("click", () => { negative = !negative; sync(); });
          hidden._visual = parts;
          hidden._signBtn = signBtn;
          row.appendChild(wrap);
          row.appendChild(hidden);
          inputs.push(hidden);
        }

        const msg = el("div", { class: "field-msg", id: fieldId + "-msg" });
        row.appendChild(msg);
        card.appendChild(row);
      }
    }

    return inputs;
  }

  // Erklärungs-Kasten ("📖"): Regel, Grafik, Beispiel, typische Fehler
  function erklaerungsBox(e, schliessen) {
    const box = el("div", { class: "erkl-box" });
    const kopf = el("div", { class: "erkl-kopf" }, [text("div", "erkl-titel", "📖 " + e.titel)]);
    if (schliessen) kopf.appendChild(el("button", { class: "btn ghost small", onclick: schliessen }, [document.createTextNode("Schließen")]));
    box.appendChild(kopf);
    box.appendChild(text("div", "erkl-sub", "Merke"));
    e.regeln.forEach((r) => box.appendChild(el("div", { class: "erkl-regel", html: ML.mathToHtml(r) })));
    if (e.grafikSVG) box.appendChild(el("div", { class: "ka-graph", html: e.grafikSVG }));
    if (e.beispiel.length) {
      box.appendChild(text("div", "erkl-sub", "Beispiel"));
      e.beispiel.forEach((b) => box.appendChild(b.label ? text("div", "step-label", b.label) : el("div", { class: "erkl-bsp", html: ML.mathToHtml(b.left) })));
    }
    box.appendChild(text("div", "erkl-sub", "Typische Fehler"));
    e.fehler.forEach((f) => box.appendChild(el("div", { class: "erkl-fehler", html: "⚠️ " + ML.mathToHtml(f) })));
    return box;
  }

  function renderTask() {
    const topic = ML.TOPICS[state.topicKey];
    const level = topic.levels.find(l => l.id === state.levelId);
    const task = state.task;

    app.innerHTML = "";
    app.appendChild(el("header", { class: "topbar" }, [
      el("button", { class: "backbtn", onclick: () => { state.view = "levels"; render(); } }, [document.createTextNode("←")]),
      text("h1", "", level.name)
    ]));

    const statsline = el("div", { class: "statsline" });
    const empfehlung = el("div", { class: "empfehlung-holder" });
    function aktualisiereStatistik() {
      const s = getStat(state.topicKey, state.levelId);
      statsline.innerHTML = "";
      statsline.appendChild(el("span", {}, [document.createTextNode("Bisher in dieser Stufe: "), el("strong", {}, [document.createTextNode(`${s.correct}/${s.attempts} richtig`)])]));
      empfehlung.innerHTML = "";
      if (!stufeSitzt(s)) return;
      const idx = topic.levels.findIndex((l) => l.id === state.levelId);
      const naechste = topic.levels[idx + 1];
      const box = el("div", { class: "empfehlung" });
      const pkt = (s.recent || []).reduce((a, b) => a + b, 0);
      box.appendChild(text("div", "", `Diese Stufe sitzt! (${String(pkt).replace(".", ",")} von 10 Punkten in den letzten 10 Aufgaben)`));
      if (naechste) {
        box.appendChild(el("button", { class: "btn small", onclick: () => {
          state.levelId = naechste.id; state.checked = false; state.showSteps = false; state.stepsRevealed = false; state.tipsShown = 0;
          state.task = erzeugeAufgabe(state.topicKey, naechste); render();
        } }, [document.createTextNode(`Weiter zu: ${naechste.name}`)]));
      } else {
        box.appendChild(text("div", "", "Das war die letzte Stufe dieses Themas – probier ein anderes Thema!"));
      }
      empfehlung.appendChild(box);
    }
    aktualisiereStatistik();
    app.appendChild(statsline);
    app.appendChild(empfehlung);

    // Erklärung: allgemeines Merkwissen zur Stufe -- sperrt das Prüfen nicht
    const erkl = ML.erklaerungFuer(state.topicKey, state.levelId);
    const erklHolder = el("div", {});
    function zeigeErklaerung(hinscrollen) {
      if (!erkl) return;
      if (erklHolder.childNodes.length && !hinscrollen) { erklHolder.innerHTML = ""; return; }
      erklHolder.innerHTML = "";
      erklHolder.appendChild(erklaerungsBox(erkl, () => { erklHolder.innerHTML = ""; }));
      if (hinscrollen) erklHolder.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    app.appendChild(erklHolder);
    const card = el("div", { class: "card" });
    const metaZeile = el("div", { class: "meta-zeile" }, [text("div", "task-meta", level.grade)]);
    if (erkl) metaZeile.appendChild(el("button", { class: "erkl-btn", onclick: () => zeigeErklaerung(false) }, [document.createTextNode("📖 Erklärung")]));
    card.appendChild(metaZeile);
    if (task._wiederholung) card.appendChild(text("div", "wdh-note", "🔁 Wiederholung: Diesen Aufgabentyp hast du zuletzt nicht geschafft."));
    if (level.calculatorHint) {
      card.appendChild(text("div", "calc-hint", "🖩 " + level.calculatorHint));
    }
    card.appendChild(el("div", { class: "task-prompt" + (task.textTask ? " text-task" : ""), html: ML.mathToHtml(task.prompt) }));
    if (typeof task.graph === "string") card.appendChild(el("div", { class: "ka-graph", html: task.graph }));
    if (task.question) {
      card.appendChild(el("div", { class: "task-question" + (task.textTask ? " text-task" : ""), html: ML.mathToHtml(task.question) }));
    }

    const inputs = baueEingaben(task, level, card, "field-", () => onCheck());

    const feedbackHolder = el("div", { id: "feedback-holder" });
    const stepsHolder = el("div", { id: "steps-holder" });
    const lockNote = el("div", { class: "lock-note" });

    const btnRow = el("div", { class: "btn-row" });
    const checkBtn = el("button", { class: "btn", onclick: onCheck }, [document.createTextNode("Prüfen")]);
    const nextBtn = el("button", { class: "btn ghost", onclick: () => {
      state.task = erzeugeAufgabe(state.topicKey, level); state.checked = false; state.showSteps = false; state.stepsRevealed = false; state.tipsShown = 0; render();
    } }, [document.createTextNode("Neue Aufgabe")]);
    const stepsBtn = el("button", { class: "btn secondary", onclick: () => {
      if (!state.checked) {
        recordAttempt(state.topicKey, state.levelId, false, 0);
        merkeWiederholung(state.topicKey, state.levelId, task);
        state.checked = true;
        aktualisiereStatistik();
      }
      state.showSteps = true;
      state.stepsRevealed = true;
      renderSteps();
      updateLockState();
      updateTipBtn();
    } }, [document.createTextNode("Rechenweg zeigen")]);
    // Tipps: Rechenweg abschnittsweise aufdecken, Prüfen bleibt erlaubt.
    // Ein Abschnitt beginnt bei jeder Beschriftung (bzw. ist eine Zeile, wenn
    // es keine Beschriftungen gibt). Der letzte Abschnitt bleibt dem vollen
    // Rechenweg vorbehalten, sonst wären Tipps ein Umweg um die Sperre.
    const alleSchritte = level.steps(task);
    const abschnitte = ML.tippAbschnitte(task, alleSchritte); // gemeinsame Regel (Logik), auch in den Tests geprüft
    const maxTipps = Math.max(0, abschnitte.length - 1);
    state.tipsShown = state.tipsShown || 0;
    const tipBtn = el("button", { class: "btn secondary", onclick: () => {
      if (state.tipsShown >= maxTipps) return;
      state.tipsShown++;
      renderSteps();
      updateTipBtn();
    } }, [document.createTextNode("Tipp")]);
    function updateTipBtn() {
      const rest = maxTipps - state.tipsShown;
      tipBtn.disabled = rest <= 0 || !!state.stepsRevealed;
      tipBtn.textContent = state.tipsShown === 0 ? "Tipp" : rest > 0 ? "Noch ein Tipp" : "Keine Tipps mehr";
    }
    btnRow.appendChild(checkBtn);
    if (maxTipps > 0) btnRow.appendChild(tipBtn);
    btnRow.appendChild(stepsBtn);
    btnRow.appendChild(nextBtn);

    card.appendChild(btnRow);
    card.appendChild(lockNote);
    card.appendChild(feedbackHolder);
    card.appendChild(stepsHolder);
    app.appendChild(card);

    function updateLockState() {
      const locked = !!state.stepsRevealed;
      checkBtn.disabled = locked;
      inputs.forEach(inp => {
        inp.disabled = locked;
        if (inp._buttons) inp._buttons.forEach(b => { b.disabled = locked; });
        if (inp._visual) inp._visual.forEach(v => { v.disabled = locked; });
        if (inp._signBtn) inp._signBtn.disabled = locked;
      });
      lockNote.textContent = locked
        ? "Rechenweg angesehen -- für diese Aufgabe kannst du nicht mehr prüfen. Starte eine neue Aufgabe, um weiterzuüben."
        : "";
    }
    updateLockState();
    updateTipBtn();
    renderSteps();

    function renderSteps() {
      stepsHolder.innerHTML = "";
      if (!state.showSteps && !state.tipsShown) return;
      const box = el("div", { class: "steps-box" + (state.showSteps ? "" : " tipp-box") });
      box.appendChild(text("div", "steps-title", state.showSteps ? "Rechenweg" : (state.tipsShown === 1 ? "Tipp" : `Tipps (${state.tipsShown} von ${maxTipps})`)));
      const sichtbar = state.showSteps ? alleSchritte : [].concat(...abschnitte.slice(0, state.tipsShown));
      sichtbar.forEach(st => {
        if (st.label) {
          // eigene Beschriftungszeile ÜBER der zugehörigen Rechnung
          box.appendChild(text("div", "step-label", st.label));
          return;
        }
        const row = el("div", { class: "step-row" });
        row.appendChild(el("div", { html: ML.mathToHtml(st.left) }));
        row.appendChild(el("div", { class: "step-right", html: st.right ? ML.mathToHtml(st.right) : "" }));
        box.appendChild(row);
      });
      stepsHolder.appendChild(box);
    }

    function onCheck() {
      if (state.stepsRevealed) return; // Sicherheitsnetz, Button ist ohnehin deaktiviert
      inputs.forEach((inp, idx) => {
        inp.classList.remove("field-error");
        if (inp._buttons) inp._buttons.forEach(b => b.classList.remove("field-error"));
        if (inp._visual) inp._visual.forEach(v => v.classList.remove("field-error"));
        const msgEl = document.getElementById("field-" + idx + "-msg");
        if (msgEl) { msgEl.textContent = ""; msgEl.classList.remove("field-tipp"); }
      });

      const values = inputs.map(inp => inp.value);
      const result = level.check(task, values);
      // gezielte Hinweise bei typischen Fehlern (ohne die Lösung zu verraten)
      let hinweise = {};
      try { hinweise = result.correct ? {} : ML.diagnose(task, values, result.fieldErrors); } catch (e) { hinweise = {}; }

      feedbackHolder.innerHTML = "";
      const fb = el("div", { class: "feedback " + (result.correct ? "ok" : "bad") });
      fb.textContent = result.correct ? (state.tipsShown ? "Richtig! (mit Tipp)" : "Richtig!") : "Das passt noch nicht -- schau dir die markierten Felder an.";
      feedbackHolder.appendChild(fb);

      if (!result.correct && Array.isArray(result.fieldErrors)) {
        result.fieldErrors.forEach(idx => {
          const inp = inputs[idx];
          if (!inp) return;
          inp.classList.add("field-error");
          if (inp._buttons) inp._buttons.forEach(b => b.classList.add("field-error"));
          if (inp._visual) inp._visual.forEach(v => v.classList.add("field-error"));
          const label = (task.fieldLabels && task.fieldLabels[idx]) || `Feld ${idx + 1}`;
          const msgEl = document.getElementById("field-" + idx + "-msg");
          if (msgEl) {
            msgEl.textContent = hinweise[idx] || `Prüfe deine Eingabe im Feld „${label}“ noch einmal.`;
            msgEl.classList.toggle("field-tipp", !!hinweise[idx]);
            if (hinweise[idx] && erkl) msgEl.appendChild(el("button", { class: "link-btn", onclick: () => zeigeErklaerung(true) }, [document.createTextNode(" 📖 mehr dazu")]));
          }
        });
      }

      if (!state.checked) {
        const punkte = result.correct ? (state.tipsShown ? 0.5 : 1) : 0;
        recordAttempt(state.topicKey, state.levelId, result.correct, punkte);
        if (!result.correct) merkeWiederholung(state.topicKey, state.levelId, task);
        else if (!state.tipsShown) wiederholungGeschafft(state.topicKey, state.levelId, task);
        state.checked = true;
        aktualisiereStatistik();
      }
    }
  }

  // ============================================================
  // KLASSENARBEITS-MODUS (nach dem Vorbild echter Arbeiten):
  // Teil A ohne / Teil B mit Taschenrechner, Aufgaben mit Teilaufgaben,
  // AFB III, Papier-Teile mit Selbstbewertung. Auswertung zeigt ALLE
  // Musterlösungen inkl. Musterzeichnungen.
  // ============================================================
  let examTimer = null;
  const klausurKey = (topicKey) => "__klausur-" + topicKey;
  const punkteText = (p) => `${String(p).replace(".", ",")} ${p === 1 ? "Punkt" : "Punkte"}`;
  const punkteVon = (p) => `${String(p).replace(".", ",")} ${p === 1 ? "Punkt" : "Punkten"}`; // "von 27 Punkten"
  const summe = (arr) => arr.reduce((a, b) => a + b, 0);

  function formatAntwort(task, i) {
    const a = task.answer[i];
    if (task.fieldType === "select") { const o = task.fieldOptions.find((x) => x.value === a); return o ? o.text : a; }
    if (a && typeof a === "object" && "num" in a) return a.den === 1 ? String(a.num) : `${a.num}/${a.den}`;
    // ausgeschrieben statt Exponentialschreibweise (0,00000096 statt 9.6e-7)
    const txt = typeof a === "number" && /e/i.test(String(a)) ? a.toFixed(20).replace(/0+$/, "").replace(/\.$/, "") : String(a);
    return txt.replace(".", ",");
  }
  function loesungsBox(teil, titel) {
    const box = el("div", { class: "steps-box" });
    box.appendChild(text("div", "steps-title", titel || "Musterlösung"));
    teil.loesung.forEach((st) => {
      if (st.label === (titel || "Musterlösung")) return; // Titel nicht doppelt anzeigen
      if (st.label) { box.appendChild(text("div", "step-label", st.label)); return; }
      const row = el("div", { class: "step-row" });
      row.appendChild(el("div", { html: ML.mathToHtml(st.left) }));
      row.appendChild(el("div", { class: "step-right", html: st.right ? ML.mathToHtml(st.right) : "" }));
      box.appendChild(row);
    });
    if (teil.loesungsGraph) box.appendChild(el("div", { class: "ka-graph", html: teil.loesungsGraph }));
    return box;
  }

  function renderExamSetup() {
    const topic = ML.TOPICS[state.topicKey];
    const cfg = state.examCfg = state.examCfg && state.examCfg.topicKey === state.topicKey ? state.examCfg : { topicKey: state.topicKey, minuten: 45, zeitlimit: true };
    app.innerHTML = "";
    app.appendChild(el("header", { class: "topbar" }, [
      el("button", { class: "backbtn", onclick: () => { state.view = "levels"; render(); } }, [document.createTextNode("←")]),
      text("h1", "", "Klassenarbeit üben")
    ]));
    const card = el("div", { class: "card" });
    card.appendChild(text("div", "setup-title", topic.name));
    card.appendChild(text("div", "exam-small", "Aufbau wie eine echte Klassenarbeit: Aufgaben mit Teilaufgaben, " +
      (ML.erzeugeKlassenarbeit(state.topicKey, 45, cfg.gebiet).mitTR ? "Teil A ohne und Teil B mit Taschenrechner, " : "ohne Taschenrechner, ") +
      "auch Begründen und Fehler finden. ✏️-Teile löst du auf Papier und bewertest sie danach selbst anhand der Musterlösung. Die Auswertung zeigt alle Lösungen und Rechenwege."));
    const auswahl = (titel, werte, aktuell, setzen, fmt) => {
      card.appendChild(text("div", "setup-title", titel));
      const g = el("div", { class: "choice-btn-group" });
      werte.forEach((w) => {
        const b = el("button", { type: "button", class: "choice-btn" + (w === aktuell() ? " selected" : ""), onclick: () => {
          setzen(w); [...g.children].forEach((c) => c.classList.remove("selected")); b.classList.add("selected");
        } }, [document.createTextNode(fmt(w))]);
        g.appendChild(b);
      });
      card.appendChild(g);
    };
    const gebiete = ML.KA_TEILGEBIETE[state.topicKey];
    if (gebiete) {
      if (!gebiete.some(([k]) => k === cfg.gebiet)) cfg.gebiet = gebiete[0][0];
      // neu zeichnen: Taschenrechner-Hinweis und Klassenstufe hängen vom Teilgebiet ab
      auswahl("Thema der Arbeit", gebiete.map(([k]) => k), () => cfg.gebiet, (w) => { cfg.gebiet = w; render(); }, (w) => gebiete.find(([k]) => k === w)[1]);
    }
    auswahl("Dauer", [45, 90], () => cfg.minuten, (w) => { cfg.minuten = w; }, (w) => `${w} min (${w === 45 ? "4" : "6"} Aufgaben)`);
    auswahl("Zeitlimit", [true, false], () => cfg.zeitlimit, (w) => { cfg.zeitlimit = w; }, (w) => (w ? "mit Zeitlimit" : "ohne Zeitlimit"));
    card.appendChild(el("div", { class: "btn-row" }, [
      el("button", { class: "btn", onclick: () => {
        state.exam = { ka: ML.erzeugeKlassenarbeit(state.topicKey, cfg.minuten, cfg.gebiet), start: Date.now(), ende: cfg.zeitlimit ? Date.now() + cfg.minuten * 60000 : null, abgegeben: false };
        state.view = "exam"; render();
      } }, [document.createTextNode("Klassenarbeit starten")]),
      el("button", { class: "btn secondary", onclick: () => { state.printKA = ML.erzeugeKlassenarbeit(state.topicKey, cfg.minuten, cfg.gebiet); state.view = "print"; render(); } }, [document.createTextNode("Als Arbeitsblatt drucken")])
    ]));
    app.appendChild(card);
  }

  // Aufgabenkarte (für Bearbeitung und Druck)
  function aufgabenKarte(a, k, mitEingaben) {
    const pkt = summe(a.teile.map((t) => summe(t.punkte)));
    const card = el("div", { class: "card exam-card" });
    card.appendChild(text("div", "ka-head", `Aufgabe ${k + 1}: ${a.titel}`));
    card.appendChild(text("div", "task-meta", `${punkteText(pkt)} · Anforderungsbereich ${["I", "II", "III"][a.afb - 1]}`));
    if (a.kontext) card.appendChild(el("div", { class: "task-prompt text-task", html: ML.mathToHtml(a.kontext) }));
    if (a.graph) card.appendChild(el("div", { class: "ka-graph", html: a.graph }));
    a.teile.forEach((t, i) => {
      const box = el("div", { class: "ka-teil" + (t.art === "papier" ? " papier" : "") });
      box.appendChild(el("div", { class: "ka-teil-text" }, [el("strong", {}, [document.createTextNode(t.label + " ")]), el("span", { html: ML.mathToHtml(t.text) }),
        el("span", { class: "ka-pkt" }, [document.createTextNode(` (${String(summe(t.punkte)).replace(".", ",")} P.)`)])]));
      if (t.art === "papier") box.appendChild(text("div", "exam-small", "✏️ Auf Papier lösen – nach der Abgabe vergleichst du mit der Musterlösung."));
      else if (mitEingaben) {
        t.prefix = `ka${k}-${i}-f`;
        t.inputs = baueEingaben(t.task, t.level || {}, box, t.prefix, null);
      }
      t.box = box;
      card.appendChild(box);
    });
    return card;
  }

  function renderExam() {
    const topic = ML.TOPICS[state.topicKey], ex = state.exam, ka = ex.ka;
    app.innerHTML = "";
    app.appendChild(el("header", { class: "topbar" }, [
      el("button", { class: "backbtn", onclick: () => {
        if (ex.abgegeben || window.confirm("Klassenarbeit wirklich abbrechen? Die Eingaben gehen verloren.")) { state.view = "levels"; render(); }
      } }, [document.createTextNode("←")]),
      text("h1", "", `Klassenarbeit: ${topic.name}`)
    ]));
    const leiste = el("div", { class: "exam-bar" });
    const uhr = el("span", { class: "exam-clock" });
    const abgebenBtn = el("button", { class: "btn small", onclick: () => abgeben(false) }, [document.createTextNode("Abgeben")]);
    leiste.appendChild(uhr); leiste.appendChild(abgebenBtn);
    app.appendChild(leiste);
    const ergebnis = el("div", {});
    app.appendChild(ergebnis);
    app.appendChild(text("div", "exam-small", `${ka.klasse} · ${ka.minuten} Minuten · ${punkteText(ka.gesamt)}`));
    let letzterTeil = null;
    ka.aufgaben.forEach((a, k) => {
      if (ka.mitTR && a.teil !== letzterTeil) {
        app.appendChild(text("h2", "ka-teilkopf", a.teil === "A" ? "Teil A – ohne Taschenrechner" : "Teil B – mit Taschenrechner"));
        letzterTeil = a.teil;
      }
      a.card = aufgabenKarte(a, k, true);
      app.appendChild(a.card);
    });
    const unten = el("div", { class: "btn-row" }, [el("button", { class: "btn", onclick: () => abgeben(false) }, [document.createTextNode("Klassenarbeit abgeben")])]);
    app.appendChild(unten);

    const tick = () => {
      if (ex.abgegeben) return;
      if (!ex.ende) { uhr.textContent = "⏱ ohne Zeitlimit"; return; }
      const rest = Math.max(0, Math.round((ex.ende - Date.now()) / 1000));
      uhr.textContent = `⏱ noch ${Math.floor(rest / 60)}:${String(rest % 60).padStart(2, "0")} min`;
      uhr.classList.toggle("knapp", rest <= 300);
      if (rest <= 0) abgeben(true);
    };
    tick();
    examTimer = setInterval(tick, 1000);

    function abgeben(zeitAbgelaufen) {
      if (ex.abgegeben) return;
      const autoTeile = [].concat(...ka.aufgaben.map((a) => a.teile.filter((t) => t.art === "auto")));
      if (!zeitAbgelaufen) {
        const leer = summe(autoTeile.map((t) => t.inputs.filter((i) => !i.value).length));
        if (leer && !window.confirm(`Es ${leer === 1 ? "ist noch 1 Feld" : "sind noch " + leer + " Felder"} leer. Trotzdem abgeben?`)) return;
      }
      ex.abgegeben = true;
      if (examTimer) { clearInterval(examTimer); examTimer = null; }
      const dauer = Math.round((Date.now() - ex.start) / 60000);
      let autoPunkte = 0, autoMax = 0;
      const papierChecks = [];
      ka.aufgaben.forEach((a) => a.teile.forEach((t) => {
        if (t.art === "papier") {
          const liste = el("div", { class: "ka-check" });
          liste.appendChild(text("div", "steps-title", "Selbstbewertung: Was hast du auf deinem Papier?"));
          t.erwartung.forEach((e) => {
            const cb = el("input", { type: "checkbox" });
            cb.addEventListener("change", aktualisiere);
            papierChecks.push({ cb, punkte: e.punkte });
            liste.appendChild(el("label", { class: "setup-check" }, [cb, document.createTextNode(` ${e.text} (${punkteText(e.punkte)})`)]));
          });
          t.box.appendChild(liste);
          t.box.appendChild(loesungsBox(t, "Musterlösung"));
          t.voll = false;
          return;
        }
        const werte = t.inputs.map((i) => i.value);
        const res = t.pruefe(werte), fehler = res.fieldErrors || [];
        const erreicht = summe(t.punkte.filter((p, j) => !fehler.includes(j)));
        autoPunkte += erreicht; autoMax += summe(t.punkte);
        t.voll = fehler.length === 0;
        let hinweise = {};
        try { hinweise = ML.diagnose(t.task, werte, fehler); } catch (e) { hinweise = {}; }
        t.inputs.forEach((inp, j) => {
          const falsch = fehler.includes(j);
          const teile = (inp._visual || []).concat(inp._buttons || []).concat(inp.tagName === "SELECT" ? [inp] : []);
          teile.forEach((x) => { x.classList.add(falsch ? "field-error" : "field-ok"); x.disabled = true; });
          if (inp._signBtn) inp._signBtn.disabled = true;
          inp.disabled = true;
          const msg = document.getElementById(t.prefix + j + "-msg");
          if (msg && falsch) {
            msg.textContent = (hinweise[j] ? hinweise[j] + " " : "") + `Richtig: ${formatAntwort(t.task, j)}`;
            msg.classList.toggle("field-tipp", !!hinweise[j]);
          }
        });
        t.box.appendChild(text("div", "exam-points " + (t.voll ? "voll" : erreicht ? "teil" : "null"), `${String(erreicht).replace(".", ",")} von ${punkteVon(summe(t.punkte))}`));
        t.box.appendChild(loesungsBox(t, "Musterlösung"));
        // Statistik & Wiederholung für Teile aus Übungsstufen
        if (t.level && t.level.id) { recordAttempt(state.topicKey, t.level.id, t.voll, t.voll ? 1 : 0); if (!t.voll) merkeWiederholung(state.topicKey, t.level.id, t.task); }
      }));
      uhr.textContent = zeitAbgelaufen ? "⏱ Zeit abgelaufen – automatisch abgegeben" : `⏱ abgegeben nach ${dauer < 1 ? "unter 1" : dauer} min`;
      abgebenBtn.remove(); unten.remove();

      const box = el("div", { class: "exam-result" });
      const noteZeile = text("div", "exam-note", ""), punkteZeile = text("div", "", ""), hinweisZeile = text("div", "exam-small", "");
      const fertigBtn = el("button", { class: "btn small", onclick: () => { ex.selbstFertig = true; aktualisiere(); } }, [document.createTextNode("Selbstbewertung abschließen")]);
      const nurFehler = el("input", { type: "checkbox" });
      nurFehler.addEventListener("change", () => ka.aufgaben.forEach((a) => {
        a.teile.forEach((t) => { t.box.style.display = nurFehler.checked && t.art === "auto" && t.voll ? "none" : ""; });
      }));
      box.appendChild(noteZeile); box.appendChild(punkteZeile); box.appendChild(hinweisZeile);
      if (papierChecks.length) box.appendChild(fertigBtn);
      box.appendChild(el("label", { class: "setup-check" }, [nurFehler, document.createTextNode(" Nur Teilaufgaben mit Fehlern anzeigen")]));
      box.appendChild(el("div", { class: "btn-row" }, [
        el("button", { class: "btn ghost small", onclick: () => { state.view = "exam-setup"; render(); } }, [document.createTextNode("Neue Klassenarbeit")]),
        el("button", { class: "btn ghost small", onclick: () => { state.view = "levels"; render(); } }, [document.createTextNode("Zu den Stufen")])
      ]));
      ergebnis.appendChild(box);

      function aktualisiere() {
        const selbst = summe(papierChecks.filter((p) => p.cb.checked).map((p) => p.punkte));
        const selbstMax = summe(papierChecks.map((p) => p.punkte));
        const fertig = !papierChecks.length || ex.selbstFertig;
        const ges = autoPunkte + selbst, pct = Math.round((ges / ka.gesamt) * 100);
        box.className = "exam-result" + (fertig ? " note-" + ML.noteKA(pct) : "");
        if (fertig) {
          const note = ML.noteKA(pct);
          noteZeile.textContent = `Note ${note}`;
          punkteZeile.textContent = `${String(ges).replace(".", ",")} von ${punkteVon(ka.gesamt)} (${pct} %)` + (selbstMax ? ` – davon ${selbst} von ${selbstMax} Punkten selbst bewertet` : "");
          hinweisZeile.textContent = "Notenschlüssel (Richtwert): 1 ab 90 %, 2 ab 77 %, 3 ab 63 %, 4 ab 50 %, 5 ab 25 %. Schulen verwenden leicht unterschiedliche Grenzen.";
          fertigBtn.remove();
          papierChecks.forEach((p) => { p.cb.disabled = true; });
          statsCache[klausurKey(state.topicKey)] = { pct, note, punkte: ges, gesamt: ka.gesamt, datum: new Date().toISOString().slice(0, 10) };
          persistStats();
        } else {
          noteZeile.textContent = "Fast fertig: Papier-Teile bewerten";
          punkteZeile.textContent = `Automatisch geprüft: ${String(autoPunkte).replace(".", ",")} von ${punkteVon(autoMax)}. Selbst bewertet bisher: ${selbst} von ${selbstMax}.`;
          hinweisZeile.textContent = "Vergleiche deine ✏️-Lösungen mit den Musterlösungen unten, hake ab, was du hast, und schließe dann die Selbstbewertung ab. Erst dann steht die Note fest.";
        }
      }
      aktualisiere();
      window.scrollTo(0, 0);
    }
  }

  // ============================================================
  // ARBEITSBLATT DRUCKEN: dieselbe Klassenarbeit als druckfertiges Blatt,
  // danach Lösungsblatt mit Musterzeichnungen, Erwartungshorizont und
  // Notenschlüssel (Punkte -> Note).
  // ============================================================
  function renderPrint() {
    const topic = ML.TOPICS[state.topicKey], ka = state.printKA;
    app.innerHTML = "";
    app.appendChild(el("div", { class: "no-print print-toolbar" }, [
      el("button", { class: "btn", onclick: () => window.print() }, [document.createTextNode("🖨 Drucken / als PDF speichern")]),
      el("button", { class: "btn ghost", onclick: () => { state.printKA = ML.erzeugeKlassenarbeit(state.topicKey, ka.minuten, ka.teilgebiet); render(); } }, [document.createTextNode("Neue Aufgaben")]),
      el("button", { class: "btn ghost", onclick: () => { state.view = "exam-setup"; render(); } }, [document.createTextNode("Zurück")])
    ]));
    const sheet = el("div", { class: "print-sheet" });
    sheet.appendChild(el("div", { class: "print-head" }, [
      text("div", "print-title", `Klassenarbeit: ${topic.name}`),
      text("div", "print-fields", "Name: ________________________     Datum: ______________"),
      text("div", "print-small", `${ka.klasse} · Bearbeitungszeit ${ka.minuten} Minuten · ${punkteText(ka.gesamt)}`)
    ]));
    let letzterTeil = null;
    ka.aufgaben.forEach((a, k) => {
      if (ka.mitTR && a.teil !== letzterTeil) { sheet.appendChild(text("div", "print-teilkopf", a.teil === "A" ? "Teil A – ohne Taschenrechner" : "Teil B – mit Taschenrechner")); letzterTeil = a.teil; }
      const box = el("div", { class: "print-task" });
      box.appendChild(text("div", "print-num", `Aufgabe ${k + 1}: ${a.titel}  (${punkteText(summe(a.teile.map((t) => summe(t.punkte))))})`));
      if (a.kontext) box.appendChild(el("div", { class: "task-prompt text-task", html: ML.mathToHtml(a.kontext) }));
      if (a.graph) box.appendChild(el("div", { class: "ka-graph", html: a.graph }));
      a.teile.forEach((t) => {
        box.appendChild(el("div", { class: "print-teil" }, [el("strong", {}, [document.createTextNode(t.label + " ")]), el("span", { html: ML.mathToHtml(t.text) }),
          document.createTextNode(` (${summe(t.punkte)} P.)`)]));
        if (t.art === "papier") { box.appendChild(el("div", { class: "print-space" })); return; }
        const task = t.task;
        if (task.fieldType === "select") {
          const grid = el("div", { class: "graph-grid" });
          task.graphs.forEach((g) => grid.appendChild(el("div", { class: "graph-cell" }, [
            el("div", { class: "graph-svg-holder", html: ML.renderGraphSVG(g.fn, Object.assign({ colors: ["#111"] }, task.graphConfig)) }), text("div", "print-line", `${g.id}: ______________`)])));
          box.appendChild(grid);
          box.appendChild(text("div", "print-small", "Zur Auswahl: " + task.fieldOptions.map((o) => o.text).join("   ")));
          return;
        }
        for (let i = 0; i < task.numFields; i++) {
          const lab = (task.fieldLabels && task.fieldLabels[i]) || "Ergebnis";
          const ch = (task.fieldKinds && task.fieldKinds[i] === "choice") || (task.perFieldType && task.perFieldType[i] === "choice") || task.fieldType === "choice";
          box.appendChild(text("div", "print-line", ch ? `${lab}:  ${(task.fieldChoices[i] || []).map((c) => "◯ " + c).join("     ")}` : `${lab}:  ____________________`));
        }
      });
      sheet.appendChild(box);
    });
    const loes = el("div", { class: "print-solutions" });
    loes.appendChild(text("div", "print-title", `Lösungen: ${topic.name}`));
    ka.aufgaben.forEach((a, k) => {
      const box = el("div", { class: "print-task" });
      box.appendChild(text("div", "print-num", `Aufgabe ${k + 1}: ${a.titel}`));
      a.teile.forEach((t) => {
        const kopf = t.art === "papier" ? `${t.label} Erwartungshorizont:` : `${t.label} ` + t.task.answer.map((x, i) => `${t.task.fieldType === "select" ? t.task.graphs[i].id : (t.task.fieldLabels[i] || "Ergebnis")}: ${formatAntwort(t.task, i)}`).join("  |  ");
        box.appendChild(text("div", "print-teil", kopf));
        if (t.art === "papier") t.erwartung.forEach((e) => box.appendChild(text("div", "print-step", `☐ ${e.text} (${e.punkte} P.)`)));
        const st = el("div", { class: "print-steps" });
        t.loesung.forEach((s) => { st.appendChild(s.label ? text("div", "step-label", s.label) : el("div", { class: "print-step", html: ML.mathToHtml(s.left) })); });
        box.appendChild(st);
        if (t.loesungsGraph) box.appendChild(el("div", { class: "ka-graph", html: t.loesungsGraph }));
      });
      loes.appendChild(box);
    });
    const g = ka.gesamt, grenze = (p) => Math.ceil((g * p) / 100 - 1e-9);
    loes.appendChild(text("div", "print-num", `Notenschlüssel (${g} Punkte): 1 ab ${grenze(90)} · 2 ab ${grenze(77)} · 3 ab ${grenze(63)} · 4 ab ${grenze(50)} · 5 ab ${grenze(25)} · 6 darunter`));
    sheet.appendChild(loes);
    app.appendChild(sheet);
  }

  function render() {
    if (examTimer) { clearInterval(examTimer); examTimer = null; }
    if (state.view === "home") renderHome();
    else if (state.view === "levels") renderLevels();
    else if (state.view === "task") renderTask();
    else if (state.view === "exam-setup") renderExamSetup();
    else if (state.view === "exam") renderExam();
    else if (state.view === "print") renderPrint();
  }

  initStorage().then(render);
})();
</script>
</body>
</html>
