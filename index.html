      svg += `<text x="${f(S[k][0] + n[0] * 14)}" y="${f(S[k][1] + n[1] * 14 + 5)}" font-size="12" fill="#64748b" text-anchor="middle">${k}</text>`;
    });
    return svg + "</svg>";
  }
  const lage = () => ({ rot: randInt(0, 3), spiegel: Math.random() < 0.5 });

  const TRIPEL = [[3, 4, 5], [5, 12, 13], [8, 15, 17], [7, 24, 25], [6, 8, 10], [9, 12, 15], [20, 21, 29]];
  // Rollen der Seiten für einen Winkel
  const rollen = (w) => (w === "α" ? { geg: "a", an: "b" } : { geg: "b", an: "a" });

  // ---- Stufe 1: Seiten benennen ----
  function gen_trig_1() {
    const w = choice(["α", "β"]), [a, b] = choice([[3, 4], [4, 3], [2, 5], [5, 2], [3, 5]]), R = rollen(w), L = lage();
    return {
      topic: "trigonometrie", level: 1, prompt: `\\text{Benenne die Seiten bezogen auf den Winkel ${w}.}`, promptText: "Seiten benennen",
      graph: dreieckSVG(Object.assign({ a, b, seiten: { a: "a", b: "b", c: "c" }, winkel: w }, L)),
      numFields: 3, fieldLabels: ["Hypotenuse", `Gegenkathete von ${w}`, `Ankathete von ${w}`],
      fieldType: "choice", fieldChoices: [["a", "b", "c"], ["a", "b", "c"], ["a", "b", "c"]],
      answer: ["c", R.geg, R.an], data: { w }
    };
  }
  function check_trig_1(task, inp) { const err = []; task.answer.forEach((x, i) => { if (inp[i] !== x) err.push(i); }); return { correct: !err.length, fieldErrors: err }; }
  function steps_trig_1(task) {
    const R = rollen(task.data.w);
    return [
      { label: "Hypotenuse: die längste Seite, gegenüber dem rechten Winkel" }, { left: T("Hypotenuse: c"), right: "" },
      { label: `Gegenkathete: liegt dem Winkel ${task.data.w} gegenüber (berührt ihn nicht)` }, { left: T(`Gegenkathete: ${R.geg}`), right: "" },
      { label: `Ankathete: liegt am Winkel ${task.data.w} an (und ist nicht die Hypotenuse)` }, { left: T(`Ankathete: ${R.an}`), right: "" }
    ];
  }

  // ---- Stufe 2: sin, cos, tan als Verhältnis ----
  function gen_trig_2() {
    const w = choice(["α", "β"]); let [x, y, h] = choice(TRIPEL); if (Math.random() < 0.5) [x, y] = [y, x];
    const a = x, b = y, c = h, R = rollen(w), G = R.geg === "a" ? a : b, A = R.an === "a" ? a : b;
    const fr = (n, d) => { const g = gcd(n, d); return { num: n / g, den: d / g }; };
    return {
      topic: "trigonometrie", level: 2, prompt: `\\text{Gib sin(${w}), cos(${w}) und tan(${w}) als Bruch an.}`, promptText: "Verhältnisse",
      graph: dreieckSVG(Object.assign({ a, b, seiten: { a: String(a), b: String(b), c: String(c) }, winkel: w }, lage())),
      numFields: 3, fieldLabels: [`sin(${w})`, `cos(${w})`, `tan(${w})`], answer: [fr(G, c), fr(A, c), fr(G, A)], data: { w, a, b, c, G, A }
    };
  }
  function check_trig_2(task, inp) {
    const err = []; task.answer.forEach((x, i) => { const f = parseUserFraction(inp[i]); if (!f || !fractionsEqual(f, x)) err.push(i); });
    return { correct: !err.length, fieldErrors: err };
  }
  function steps_trig_2(task) {
    const { w, c, G, A } = task.data;
    return [
      { label: `Bezogen auf ${w}: Gegenkathete ${G}, Ankathete ${A}, Hypotenuse ${c}` },
      { left: `\\sin(${w}) = \\dfrac{${T("Gegenkathete")}}{${T("Hypotenuse")}} = \\dfrac{${G}}{${c}}`, right: "" },
      { left: `\\cos(${w}) = \\dfrac{${T("Ankathete")}}{${T("Hypotenuse")}} = \\dfrac{${A}}{${c}}`, right: "" },
      { left: `\\tan(${w}) = \\dfrac{${T("Gegenkathete")}}{${T("Ankathete")}} = \\dfrac{${G}}{${A}}`, right: "" }
    ];
  }

  // ---- Stufe 3: Seite berechnen ----
  // Fälle bezogen auf α: [gegeben, gesucht, Funktion, Formel(α, x) -> gesucht]
  const SEITEN_FAELLE = [
    ["c", "a", "sin", (al, x) => x * Math.sin(al)], ["c", "b", "cos", (al, x) => x * Math.cos(al)], ["b", "a", "tan", (al, x) => x * Math.tan(al)],
    ["a", "c", "sin", (al, x) => x / Math.sin(al)], ["b", "c", "cos", (al, x) => x / Math.cos(al)], ["a", "b", "tan", (al, x) => x / Math.tan(al)]
  ];
  const NAME = { a: "Gegenkathete", b: "Ankathete", c: "Hypotenuse" };
  function gen_trig_3() {
    const al = randInt(20, 70), [gg, gs, fn, formel] = choice(SEITEN_FAELLE), x = randInt(4, 20);
    const erg = round2(formel(al * RAD, x));
    const seiten = { a: "", b: "", c: "" }; seiten[gg] = `${x} cm`; seiten[gs] = "?";
    const dims = gs === "c" || gg === "c" ? { a: Math.sin(al * RAD), b: Math.cos(al * RAD) } : { a: Math.tan(al * RAD), b: 1 };
    return {
      topic: "trigonometrie", level: 3,
      prompt: `${T("Gegeben:")}\\;\\; \\alpha = ${al}°,\\;\\; ${gg} = ${x}\\text{ cm}.\\;\\; ${T("Berechne")}\\; ${gs}.`, promptText: `alpha=${al}, ${gg}=${x}`,
      graph: dreieckSVG(Object.assign({ a: dims.a, b: dims.b, seiten, winkel: "α", winkelText: `${al}°` }, lage())),
      numFields: 1, fieldLabels: [`${gs} in cm (2 Nachkommastellen)`], answer: [erg], tolerance: 0.02, data: { al, gg, gs, fn, x }
    };
  }
  function check_trig_3(task, inp) { const v = parseUserNumber(inp[0]); const ok = !isNaN(v) && Math.abs(v - task.answer[0]) <= task.tolerance; return { correct: ok, fieldErrors: ok ? [] : [0] }; }
  function steps_trig_3(task) {
    const { al, gg, gs, fn, x } = task.data, F = { sin: ["Gegenkathete", "Hypotenuse"], cos: ["Ankathete", "Hypotenuse"], tan: ["Gegenkathete", "Ankathete"] }[fn];
    const z = gs === "c" ? `${gg} = ${x}` : `${gs}`;
    return [
      { label: `${gg} ist die ${NAME[gg]}, ${gs} die ${NAME[gs]} von α ⇒ ${fn} verwenden` },
      { left: `\\${fn}(${al}°) = \\dfrac{${T(F[0])}}{${T(F[1])}}`, right: "" },
      { left: gs === "c" ? `c = \\dfrac{${x}}{\\${fn}(${al}°)}` : (gg === "c" || (fn === "tan" && gs === "a")) ? `${gs} = ${x}\\cdot \\${fn}(${al}°)` : `${gs} = \\dfrac{${x}}{\\${fn}(${al}°)}`, right: "" },
      { left: `${gs} \\approx ${fmtNum(task.answer[0])}\\text{ cm}`, right: "" },
      { label: "Taschenrechner im Grad-Modus (DEG)!" }
    ];
  }

  // ---- Stufe 4: Winkel berechnen ----
  function gen_trig_4() {
    const fall = choice(["sin", "cos", "tan"]); let a, b, c;
    if (fall === "tan") { a = randInt(2, 15); b = randInt(2, 15); } else { c = randInt(6, 20); const k = randInt(2, c - 1); if (fall === "sin") a = k; else b = k; }
    const al = fall === "sin" ? Math.asin(a / c) / RAD : fall === "cos" ? Math.acos(b / c) / RAD : Math.atan(a / b) / RAD;
    const aa = fall === "cos" ? Math.sqrt(c * c - b * b) : a, bb = fall === "sin" ? Math.sqrt(c * c - a * a) : b;
    const seiten = { a: fall !== "cos" ? `${a} cm` : "", b: fall !== "sin" ? `${b} cm` : "", c: fall !== "tan" ? `${c} cm` : "" };
    const geg = fall === "sin" ? `a = ${a}\\text{ cm},\\; c = ${c}\\text{ cm}` : fall === "cos" ? `b = ${b}\\text{ cm},\\; c = ${c}\\text{ cm}` : `a = ${a}\\text{ cm},\\; b = ${b}\\text{ cm}`;
    return {
      topic: "trigonometrie", level: 4, prompt: `${T("Gegeben:")}\\;\\; ${geg}.\\;\\; ${T("Berechne den Winkel α.")}`, promptText: "Winkel",
      graph: dreieckSVG(Object.assign({ a: aa, b: bb, seiten, winkel: "α", winkelText: "α = ?" }, lage())),
      numFields: 1, fieldLabels: ["α in Grad (1 Nachkommastelle)"], answer: [Math.round(al * 10) / 10], tolerance: 0.06, data: { fall, a, b, c, al }
    };
  }
  function check_trig_4(task, inp) { const v = parseUserNumber(inp[0]); const ok = !isNaN(v) && Math.abs(v - task.answer[0]) <= task.tolerance; return { correct: ok, fieldErrors: ok ? [] : [0] }; }
  function steps_trig_4(task) {
    const { fall, a, b, c } = task.data;
    const q = fall === "sin" ? [a, c] : fall === "cos" ? [b, c] : [a, b];
    return [
      { label: fall === "sin" ? "Gegenkathete und Hypotenuse gegeben ⇒ Sinus" : fall === "cos" ? "Ankathete und Hypotenuse gegeben ⇒ Kosinus" : "Gegenkathete und Ankathete gegeben ⇒ Tangens" },
      { left: `\\${fall}(\\alpha) = \\dfrac{${q[0]}}{${q[1]}}`, right: "" },
      { label: `Umkehrfunktion ${fall}⁻¹ (auf dem Taschenrechner meist SHIFT + ${fall})` },
      { left: `\\alpha = ${fall}^{-1}\\left(\\dfrac{${q[0]}}{${q[1]}}\\right) \\approx ${fmt1(task.answer[0])}°`, right: "" }
    ];
  }

  // ---- Stufe 5: Textaufgaben ----
  function gen_trig_5() {
    const sub = choice(["leiter", "rampe", "turm", "steigung", "drachen"]), n = choice(NAMEN);
    if (sub === "leiter") {
      const L = choice([3, 4, 5, 6, 8]), d = choice([0.8, 1, 1.2, 1.5, 2, 2.5]), w = Math.round(Math.acos(d / L) / RAD * 10) / 10;
      const sicher = w >= 65 && w <= 75 ? "ja" : "nein";
      return textTask("trigonometrie", 5, "leiter",
        T(`${n} lehnt eine ${L} m lange Leiter an eine Hauswand. Der Fuß der Leiter steht ${fmtNum(d)} m von der Wand entfernt. Sicher steht eine Leiter bei einem Anstellwinkel zum Boden zwischen 65° und 75°.`),
        T("Wie groß ist der Anstellwinkel, und steht die Leiter sicher?"), [
          { label: "Winkel zum Boden in Grad (1 Nachkommastelle)", kind: "number", answer: w, tol: 0.06 },
          { label: "Steht die Leiter sicher?", kind: "choice", choices: ["ja", "nein"], answer: sicher }
        ], [
          { label: "Leiter = Hypotenuse, Abstand zur Wand = Ankathete des Winkels am Boden ⇒ Kosinus" },
          { left: `\\cos(\\alpha) = \\dfrac{${fmtNum(d)}}{${L}} \\;\\Rightarrow\\; \\alpha \\approx ${fmt1(w)}°`, right: "" },
          { left: T(sicher === "ja" ? "liegt zwischen 65° und 75° ⇒ sicher" : w < 65 ? "kleiner als 65° ⇒ Leiter kann wegrutschen" : "größer als 75° ⇒ Leiter kann nach hinten kippen"), right: "" }
        ], { dataExtra: { L, d } });
    }
    if (sub === "rampe") {
      const h = choice([12, 15, 18, 20, 24, 30]), l = choice([2, 2.5, 3, 4, 5]);
      const pz = Math.round((h / (l * 100)) * 1000) / 10, w = Math.round(Math.atan(h / (l * 100)) / RAD * 10) / 10;
      return textTask("trigonometrie", 5, "rampe",
        T(`Vor dem Eingang einer Schule liegt eine Stufe von ${h} cm Höhe. Eine Rollstuhlrampe soll sie auf ${fmtNum(l)} m waagerechter Länge überbrücken. Erlaubt ist eine Steigung von höchstens 6 %.`),
        T("Wie groß sind Steigung und Steigungswinkel der Rampe, und ist sie zulässig?"), [
          { label: "Steigung in % (1 Nachkommastelle)", kind: "number", answer: pz, tol: 0.06 },
          { label: "Steigungswinkel in Grad (1 Nachkommastelle)", kind: "number", answer: w, tol: 0.06 },
          { label: "zulässig?", kind: "choice", choices: ["ja", "nein"], answer: pz <= 6 ? "ja" : "nein" }
        ], [
          { label: "Steigung = Höhenunterschied : waagerechte Länge (gleiche Einheit!)" }, { left: `${h} : ${fmtNum(l * 100)} = ${fmtNum(round4(h / (l * 100)))} = ${fmtNum(pz)}\\,\\%`, right: "" },
          { label: "Die Steigung ist der Tangens des Winkels" }, { left: `\\alpha = \\tan^{-1}(${fmtNum(round4(h / (l * 100)))}) \\approx ${fmt1(w)}°`, right: "" }
        ], { dataExtra: { h, l } });
    }
    if (sub === "turm") {
      const s = choice([12, 15, 18, 24, 30, 36]), w = randInt(25, 60), H = Math.round(s * Math.tan(w * RAD) * 10) / 10;
      return textTask("trigonometrie", 5, "turm",
        T(`Ein Kirchturm wirft auf ebenem Boden einen ${s} m langen Schatten. Die Sonnenstrahlen treffen unter einem Winkel von ${w}° auf den Boden.`),
        T("Wie hoch ist der Turm? (1 Nachkommastelle)"), [{ label: "Höhe in m", kind: "number", answer: H, tol: 0.06 }],
        [{ label: "Schatten = Ankathete, Turm = Gegenkathete des Sonnenwinkels ⇒ Tangens" }, { left: `h = ${s}\\cdot \\tan(${w}°) \\approx ${fmt1(H)}`, right: "" }], { dataExtra: { s, w } });
    }
    if (sub === "steigung") {
      const p = choice([8, 10, 12, 15, 18, 20]), km = choice([1, 1.5, 2, 3]);
      const w = Math.atan(p / 100) / RAD, hd = Math.round(km * 1000 * Math.sin(w * RAD));
      return textTask("trigonometrie", 5, "steigung",
        T(`Ein Verkehrsschild an einer Passstraße zeigt „${p} % Steigung“. ${n} fährt mit dem Rad ${fmtNum(km)} km auf dieser Straße bergauf (gemessen entlang der Straße).`),
        T("Wie groß ist der Steigungswinkel, und wie viele Höhenmeter schafft das Rad dabei?"), [
          { label: "Steigungswinkel in Grad (1 Nachkommastelle)", kind: "number", answer: Math.round(w * 10) / 10, tol: 0.06 },
          { label: "Höhenmeter (ganze Meter)", kind: "number", answer: hd, tol: 1 }
        ], [
          { label: `${p} % bedeutet: ${p} m Höhe auf 100 m waagerechter Strecke ⇒ tan(α) = ${fmtNum(p / 100)}` },
          { left: `\\alpha = \\tan^{-1}(${fmtNum(p / 100)}) \\approx ${fmt1(w)}°`, right: "" },
          { label: "Die gefahrene Strecke ist die Hypotenuse ⇒ Sinus" },
          { left: `h = ${km * 1000}\\cdot \\sin(${fmt1(w)}°) \\approx ${hd}\\text{ m}`, right: "" },
          { label: "Achtung: 12 % Steigung sind NICHT 12°." }
        ], { dataExtra: { p, km } });
    }
    const L = choice([30, 40, 50, 60]), w = randInt(35, 65), hand = 1.5, H = Math.round((L * Math.sin(w * RAD) + hand) * 10) / 10;
    return textTask("trigonometrie", 5, "drachen",
      T(`${n} lässt einen Drachen steigen. Die Schnur ist ${L} m lang, straff gespannt und bildet mit der Waagerechten einen Winkel von ${w}°. ${n} hält die Schnur in 1,5 m Höhe.`),
      T("In welcher Höhe über dem Boden fliegt der Drachen? (1 Nachkommastelle)"), [{ label: "Höhe in m", kind: "number", answer: H, tol: 0.06 }],
      [{ label: "Schnur = Hypotenuse, gesuchte Höhe über der Hand = Gegenkathete ⇒ Sinus" }, { left: `${L}\\cdot \\sin(${w}°) \\approx ${fmtNum(round2(L * Math.sin(w * RAD)))}`, right: "" },
       { label: "Die Handhöhe noch dazurechnen" }, { left: `${fmtNum(round2(L * Math.sin(w * RAD)))} + 1,5 \\approx ${fmt1(H)}`, right: "" }], { dataExtra: { L, w } });
  }

  // ============================================================
  // ALLGEMEINE DREIECKE: Sinussatz und Kosinussatz (Kl. 10)
  // Bezeichnungen wie üblich: Seite a liegt A gegenüber (also α), b gegenüber β, c gegenüber γ.
  // ============================================================
  // Dreieck aus drei Seiten, mit Winkel- und Seitenbeschriftung.
  // o = { a, b, c, seiten: {a,b,c}, winkel: {α,β,γ} (Text oder leer), spiegel }
  function dreieckAllgSVG(o) {
    const W = 300, Hh = 220, pad = 36, { a, b, c } = o;
    const xC = (b * b + c * c - a * a) / (2 * c), yC = Math.sqrt(Math.max(0, b * b - xC * xC));
    let P = { A: [0, 0], B: [c, 0], C: [xC, yC] };
    if (o.spiegel) Object.keys(P).forEach((k) => { P[k] = [c - P[k][0], P[k][1]]; });
    const xs = Object.values(P).map((p) => p[0]), ys = Object.values(P).map((p) => p[1]);
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    const sk = Math.min((W - 2 * pad) / (maxX - minX || 1), (Hh - 2 * pad) / (maxY - minY || 1));
    const offX = (W - (maxX - minX) * sk) / 2, offY = (Hh - (maxY - minY) * sk) / 2;
    const px = (p) => [offX + (p[0] - minX) * sk, Hh - (offY + (p[1] - minY) * sk)];
    const S = { A: px(P.A), B: px(P.B), C: px(P.C) };
    const M = [(S.A[0] + S.B[0] + S.C[0]) / 3, (S.A[1] + S.B[1] + S.C[1]) / 3];
    const norm = (v) => { const l = Math.hypot(v[0], v[1]) || 1; return [v[0] / l, v[1] / l]; };
    const f = (x) => x.toFixed(1);
    let svg = `<svg viewBox="0 0 ${W} ${Hh}" width="${W}" height="${Hh}" xmlns="http://www.w3.org/2000/svg" class="graph-svg">`;
    svg += `<polygon points="${[S.A, S.B, S.C].map((p) => f(p[0]) + "," + f(p[1])).join(" ")}" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2"/>`;
    const winkel = o.winkel || {};
    [["A", "B", "C", "α"], ["B", "C", "A", "β"], ["C", "A", "B", "γ"]].forEach(([v, p1, p2, gr]) => {
      if (!winkel[gr]) return;
      const V = S[v], v1 = norm([S[p1][0] - V[0], S[p1][1] - V[1]]), v2 = norm([S[p2][0] - V[0], S[p2][1] - V[1]]), r = 22;
      const cross = v1[0] * v2[1] - v1[1] * v2[0];
      svg += `<path d="M ${f(V[0] + v1[0] * r)} ${f(V[1] + v1[1] * r)} A ${r} ${r} 0 0 ${cross > 0 ? 1 : 0} ${f(V[0] + v2[0] * r)} ${f(V[1] + v2[1] * r)}" fill="none" stroke="#dc2626" stroke-width="2"/>`;
      const bi = norm([v1[0] + v2[0], v1[1] + v2[1]]);
      svg += `<text x="${f(V[0] + bi[0] * 38)}" y="${f(V[1] + bi[1] * 38 + 5)}" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626" stroke="white" stroke-width="3" paint-order="stroke">${winkel[gr]}</text>`;
    });
    const seite = (P1, P2, txt) => {
      if (!txt) return "";
      const m = [(P1[0] + P2[0]) / 2, (P1[1] + P2[1]) / 2], n = norm([m[0] - M[0], m[1] - M[1]]);
      return `<text x="${f(m[0] + n[0] * 22)}" y="${f(m[1] + n[1] * 22 + 5)}" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a" stroke="white" stroke-width="3" paint-order="stroke">${txt}</text>`;
    };
    const sei = o.seiten || {};
    svg += seite(S.B, S.C, sei.a) + seite(S.A, S.C, sei.b) + seite(S.A, S.B, sei.c);
    ["A", "B", "C"].forEach((k) => {
      const n = norm([S[k][0] - M[0], S[k][1] - M[1]]);
      svg += `<text x="${f(S[k][0] + n[0] * 14)}" y="${f(S[k][1] + n[1] * 14 + 5)}" font-size="12" fill="#64748b" text-anchor="middle">${k}</text>`;
    });
    return svg + "</svg>";
  }
  // Seitenlängen aus zwei Winkeln (Grad) und Seite a
  const seitenAusWinkeln = (al, be, a) => { const ga = 180 - al - be; return { a, b: (a * Math.sin(be * RAD)) / Math.sin(al * RAD), c: (a * Math.sin(ga * RAD)) / Math.sin(al * RAD), ga }; };
  const winkelAusSeiten = (a, b, c) => ({ al: Math.acos((b * b + c * c - a * a) / (2 * b * c)) / RAD, be: Math.acos((a * a + c * c - b * b) / (2 * a * c)) / RAD });
  const r2 = (x) => Math.round(x * 100) / 100, r1 = (x) => Math.round(x * 10) / 10;

  // ---- Stufe 6: Sinussatz ----
  function gen_trig_6() {
    const sub = choice(["seite", "winkel"]);
    if (sub === "seite") {
      let al, be; do { al = randInt(25, 110); be = randInt(25, 110); } while (al + be > 150);
      const a = randInt(5, 20), S = seitenAusWinkeln(al, be, a), ziel = choice(["b", "c"]);
      const erg = r2(S[ziel]), wz = ziel === "b" ? be : S.ga, wn = ziel === "b" ? "β" : "γ";
      const seiten = { a: `${a} cm`, b: "", c: "" }; seiten[ziel] = "?";
      return {
        topic: "trigonometrie", level: 6, subtype: "seite",
        prompt: `${T("Gegeben:")}\\;\\; a = ${a}\\text{ cm},\\; \\alpha = ${al}°,\\; \\beta = ${be}°.\\;\\; ${T("Berechne")}\\; ${ziel}.`, promptText: "Sinussatz Seite",
        graph: dreieckAllgSVG({ a: S.a, b: S.b, c: S.c, seiten, winkel: { α: `${al}°`, β: `${be}°`, γ: ziel === "c" ? "γ" : "" }, spiegel: Math.random() < 0.5 }),
        numFields: 1, fieldLabels: [`${ziel} in cm (2 Nachkommastellen)`], answer: [erg], tolerance: 0.02, data: { al, be, a, ziel, wz, wn, ga: S.ga }
      };
    }
    // Winkel: a > b, damit β eindeutig (spitz) ist
    let a, b, al; do { a = randInt(6, 20); b = randInt(4, a - 1); al = randInt(30, 120); } while (b * Math.sin(al * RAD) / a >= 0.98);
    const be = Math.asin((b * Math.sin(al * RAD)) / a) / RAD, ga = 180 - al - be, c = (a * Math.sin(ga * RAD)) / Math.sin(al * RAD);
    return {
      topic: "trigonometrie", level: 6, subtype: "winkel",

      { label: "Klammern auflösen" }, { left: `${linTerm(a, a * b)} = ${linTerm(c, c * d + e)}`, right: "" },
      { label: "x-Glieder links, Zahlen rechts sammeln" }, { left: `${linTerm(a - c, 0)} = ${c * d + e - a * b}`, right: "" },
      { left: `x = ${x0}`, right: "" }

  }

  // ---- Stufe 5: Binomische Formeln anwenden ----
  function gen_term_5() {
    const sub = choice(["plus", "minus", "dritte", "koeff", "zweiVar", "luecke"]), a = randInt(1, 9);
    if (sub === "zweiVar") { // (12 + 5m)²
      const c = randInt(2, 12), k = randInt(2, 6), v = choice(["m", "a", "b", "y"]), mi = Math.random() < 0.5;
      return { topic: "terme_gleichungen", level: 5, subtype: sub, signed: true, prompt: `(${c} ${mi ? "-" : "+"} ${k}${v})^{2}`, promptText: "binom2",
        question: `\\text{Multipliziere aus:}\\;\\; \\;? + \\;?\\,${v} + \\;?\\,${v}^{2}`, numFields: 3, fieldLabels: ["Zahl ohne " + v, "Zahl vor " + v, `Zahl vor ${v}²`],
        answer: [c * c, (mi ? -2 : 2) * c * k, k * k], data: { c, k, v, mi } };
    }
    if (sub === "luecke") { // (3,5x − ?y)² = 12,25x² − ?xy + 36y²
      const k = choice([2, 3, 4, 5, 1.5, 2.5, 3.5]), m = randInt(2, 9);
      return { topic: "terme_gleichungen", level: 5, subtype: sub, prompt: `(${fmtNum(k)}x - \\square\\,y)^{2} = ${fmtNum(k * k)}x^{2} - \\square\\,xy + ${m * m}y^{2}`, promptText: "Lücke",
        question: `\\text{Fülle die Lücken (▢) aus.}`, numFields: 2, fieldLabels: ["Zahl vor y in der Klammer", "Zahl vor xy"], answer: [m, 2 * k * m], data: { k, m } };
    }
    if (sub === "koeff") {
      const k = randInt(2, 5), m = nz(-7, 7);
      return { topic: "terme_gleichungen", level: 5, subtype: sub, signed: true, prompt: `(${k}x ${m > 0 ? "+" : "-"} ${Math.abs(m)})^{2}`, promptText: "binomisch",
        question: `\\text{Multipliziere aus:}\\;\\; \\;?\\,x^{2} + \\;?\\,x + \\;?`, numFields: 3, fieldLabels: ["Zahl vor x²", "Zahl vor x", "Zahl ohne x"],
        answer: [k * k, 2 * k * m, m * m], data: { k, m } };
    }
    const p = sub === "plus" ? 2 * a : sub === "minus" ? -2 * a : 0, q = sub === "dritte" ? -a * a : a * a;
    const pr = sub === "plus" ? `(x + ${a})^{2}` : sub === "minus" ? `(x - ${a})^{2}` : `(x + ${a})(x - ${a})`;
    return { topic: "terme_gleichungen", level: 5, subtype: sub, signed: true, prompt: pr, promptText: pr,
      question: `\\text{Multipliziere aus:}\\;\\; x^{2} + \\;?\\,x + \\;?`, numFields: 2, fieldLabels: ["Zahl vor x", "Zahl ohne x"], answer: [p, q], data: { a } };
  }
  function steps_term_5(task) {
    const s = task.subtype;
    if (s === "zweiVar") { const { c, k, v, mi } = task.data; return [{ label: (mi ? "2." : "1.") + ` binomische Formel mit a = ${c} und b = ${k}${v}` },
      { left: `${c}^{2} ${mi ? "-" : "+"} 2\\cdot ${c}\\cdot ${k}${v} + (${k}${v})^{2} = ${c * c} ${mi ? "-" : "+"} ${2 * c * k}${v} + ${k * k}${v}^{2}`, right: "" }]; }
    if (s === "luecke") { const { k, m } = task.data; return [{ label: "Hinten steht b² – daraus b bestimmen, dann das Mischglied 2ab" },
      { left: `b^{2} = ${m * m}y^{2} \\;\\Rightarrow\\; b = ${m}y`, right: "" }, { left: `2ab = 2\\cdot ${fmtNum(k)}x\\cdot ${m}y = ${fmtNum(2 * k * m)}xy`, right: "" }]; }
    if (s === "koeff") { const { k, m } = task.data; return [
      { label: "1. binomische Formel mit a = " + k + "x und b = " + m }, { left: `(${k}x)^{2} + 2\\cdot ${k}x\\cdot (${m}) + (${m})^{2}`, right: "" },
      { left: `= ${k * k}x^{2} ${2 * k * m < 0 ? "-" : "+"} ${Math.abs(2 * k * m)}x + ${m * m}`, right: "" }]; }
    const a = task.data.a;
    if (s === "dritte") return [{ label: "3. binomische Formel: (a + b)(a − b) = a² − b²" }, { left: `x^{2} - ${a * a}`, right: "" }];
    return [{ label: s === "plus" ? "1. binomische Formel: (a + b)² = a² + 2ab + b²" : "2. binomische Formel: (a − b)² = a² − 2ab + b²" },
      { left: `x^{2} ${s === "plus" ? "+" : "-"} 2\\cdot ${a}\\cdot x + ${a}^{2} = x^{2} ${s === "plus" ? "+" : "-"} ${2 * a}x + ${a * a}`, right: "" }];
  }

  // ---- Stufe 6: Faktorisieren ----
  function gen_term_6() {
    const sub = choice(["ausklammern", "rueckwaerts", "dritte"]);
    if (sub === "ausklammern") {
      let a, b; do { a = nz(-9, 9); b = nz(-9, 9); } while (gcd(a, b) !== 1 || a < 0);
      const k = randInt(2, 9);
      return { topic: "terme_gleichungen", level: 6, subtype: sub, signed: true, prompt: linTerm(k * a, k * b), promptText: "ausklammern",
        question: `\\text{Klammere die größte gemeinsame Zahl aus:}\\;\\; \\;?\\,(\\;?\\,x + \\;?)`, numFields: 3, fieldLabels: ["Zahl vor der Klammer", "Zahl vor x in der Klammer", "Zahl ohne x in der Klammer"],
        answer: [k, a, b], data: { k, a, b } };
    }
    const a = nz(-9, 9);
    if (sub === "rueckwaerts") return { topic: "terme_gleichungen", level: 6, subtype: sub, signed: true, prompt: `x^{2} ${a > 0 ? "+" : "-"} ${Math.abs(2 * a)}x + ${a * a}`, promptText: "rückwärts",
      question: `\\text{Schreibe als Quadrat:}\\;\\; (x + \\;?)^{2}`, numFields: 1, fieldLabels: ["Zahl in der Klammer (mit Vorzeichen)"], answer: [a], data: { a } };
    const b = Math.abs(a);
    return { topic: "terme_gleichungen", level: 6, subtype: sub, prompt: `x^{2} - ${b * b}`, promptText: "dritte rückwärts",
      question: `\\text{Faktorisiere:}\\;\\; (x + \\;?)(x - \\;?)`, numFields: 1, fieldLabels: ["Zahl in den Klammern"], answer: [b], data: { a: b } };
  }
  function steps_term_6(task) {
    const s = task.subtype, d = task.data;
    if (s === "ausklammern") return [{ label: `Größter gemeinsamer Teiler von ${d.k * d.a} und ${Math.abs(d.k * d.b)} ist ${d.k}` }, { left: `${linTerm(d.k * d.a, d.k * d.b)} = ${d.k}(${linTerm(d.a, d.b)})`, right: "" }];
    if (s === "rueckwaerts") return [{ label: "Erkennen: x² ± 2ax + a² ist eine binomische Formel" }, { left: `a^{2} = ${d.a * d.a} \\;\\Rightarrow\\; a = ${Math.abs(d.a)},\\; ${T("Vorzeichen vom Mittelglied")}`, right: "" }, { left: `= (${linTerm(1, d.a)})^{2}`, right: "" }];
    return [{ label: "3. binomische Formel rückwärts: a² − b² = (a + b)(a − b)" }, { left: `x^{2} - ${d.a * d.a} = (x + ${d.a})(x - ${d.a})`, right: "" }];
  }

  // ---- Stufe 7: Lineare Gleichungssysteme ----
  function gen_term_7() {
    let a1, b1, a2, b2, x0, y0;
    do { a1 = nz(-5, 5); b1 = nz(-5, 5); a2 = nz(-5, 5); b2 = nz(-5, 5); x0 = randInt(-6, 6); y0 = randInt(-6, 6); } while (a1 * b2 - a2 * b1 === 0);
    const c1 = a1 * x0 + b1 * y0, c2 = a2 * x0 + b2 * y0;
    const gl = (a, b, c) => `${linTerm(a, 0)} ${b > 0 ? "+" : "-"} ${Math.abs(b) === 1 ? "" : Math.abs(b)}y = ${c}`;
    return {
      topic: "terme_gleichungen", level: 7, signed: true, prompt: `\\text{I:}\\;\\; ${gl(a1, b1, c1)}\\qquad \\text{II:}\\;\\; ${gl(a2, b2, c2)}`, promptText: "LGS",
      question: `\\text{Löse das Gleichungssystem.}`, numFields: 2, fieldLabels: ["x", "y"], answer: [x0, y0], data: { a1, b1, c1, a2, b2, c2, x0, y0 }
    };
  }
  function steps_term_7(task) {
    const { a1, b1, c1, a2, b2, c2, x0, y0 } = task.data;
    const D = a1 * b2 - a2 * b1;
    return [
      { label: `Additionsverfahren: I mal ${b2}, II mal ${b1}, dann subtrahieren – y fällt weg` },
      { left: `(${a1 * b2} - (${a2 * b1}))x = ${c1 * b2} - (${c2 * b1}) \\;\\Rightarrow\\; ${D}x = ${c1 * b2 - c2 * b1}`, right: "" },
      { left: `x = ${x0}`, right: "" },
      { label: "x in Gleichung I einsetzen" }, { left: `${a1}\\cdot (${x0}) + ${b1}y = ${c1} \\;\\Rightarrow\\; y = ${y0}`, right: "" },
      { label: "Probe in Gleichung II" }, { left: `${a2}\\cdot (${x0}) + ${b2}\\cdot (${y0}) = ${c2}\\;\\; ✓`, right: "" }
    ];
  }

  // ---- Stufe 8: Gleichungen aufstellen (Textaufgaben) ----

        { left: `${w1 + w2}x = ${s2 - s1} \\;\\Rightarrow\\; x = ${t0}`, right: "" }, { left: `${s1} + ${w1}\\cdot ${t0} = ${s1 + w1 * t0}`, right: "" }
      ], { dataExtra: { s1, w1, s2, w2 } });

  // ---- Stufe 9: Terme aufstellen (Texte in Terme, Wertetabelle, Alter) ----
  // Jede Formulierung trägt ihre Rechenschritte (ops) – der Test rechnet daraus unabhängig nach.
  function gen_term_9() {
    const sub = choice(["text", "text", "tabelle", "alter"]);
    if (sub === "text") {
      const k = randInt(2, 9), c = randInt(2, 12), q = choice([2, 3, 4, 5, 7]);
      const vorlagen = [
        [`Vermehre das ${k}-Fache einer Zahl um ${c}.`, k, c, [["mal", k], ["plus", c]]],
        [`Vermindere das ${k}-Fache einer Zahl um ${c}.`, k, -c, [["mal", k], ["plus", -c]]],
        [`Addiere ${c} zum ${k}-Fachen einer Zahl.`, k, c, [["mal", k], ["plus", c]]],
        [`Subtrahiere eine Zahl von ${c}.`, -1, c, [["mal", -1], ["plus", c]]],
        [`Das Produkt aus ${k} und einer Zahl, vergrößert um ${c}.`, k, c, [["mal", k], ["plus", c]]],
        [`Die Summe aus ${c} und dem ${q === 2 ? "halben" : ["", "", "", "dritten", "vierten", "fünften", "", "siebten"][q]} Teil einer Zahl.`, { num: 1, den: q }, c, [["durch", q], ["plus", c]]],

      const xs = mische([-2, -1, 0, 1, 2, 3, 4, 5]).slice(0, 3).sort((p, q) => p - q);
      const term = `${A === 0 ? "" : A === 1 ? "x^{2}" : A === -1 ? "-x^{2}" : `${A}x^{2}`}${B === 0 ? "" : `${A !== 0 && B > 0 ? " + " : B < 0 ? " - " : ""}${Math.abs(B) === 1 ? "" : fmtNum(Math.abs(B))}x`}${C === 0 ? "" : ` ${C > 0 ? "+" : "-"} ${Math.abs(C)}`}`.replace(/^ - /, "-");
      const werte = xs.map((x) => A * x * x + B * x + C);

  function steps_term_9(task) {

      { left: `${a.den === 1 ? (a.num === -1 ? "-" : a.num === 1 ? "" : a.num) : `\\dfrac{${a.num}}{${a.den}}`}x${b.num === 0 ? "" : b.num > 0 ? ` + ${b.num}` : ` - ${-b.num}`}`, right: "" }]; }
    if (s === "tabelle") return [{ label: "Für x die Zahl einsetzen – negative Zahlen in Klammern!" }].concat(d.xs.map((x, i) => ({ left: `T(${x}) = ${fmtNum(task.answer[i].num / task.answer[i].den)}`, right: "" })));
    return [{ label: "Terme aufstellen" }, { left: T(`Schwester: x + ${d.dm}, Mutter: ${d.fm}x, Vater: ${d.fm}x + ${d.dv}`), right: "" },
      { label: `x = ${d.p} einsetzen` }, { left: T(`${d.p + d.dm}, ${d.fm * d.p} und ${d.fm * d.p + d.dv} Jahre`), right: "" }];
  }

  // ---- Stufe 10: Formeln umstellen ----
  const FORMELN = [
    { f: "W = U\\cdot I\\cdot t", nach: "t", rich: "t = \\dfrac{W}{U\\cdot I}", falsch: ["t = W\\cdot U\\cdot I", "t = \\dfrac{U\\cdot I}{W}"], werte: () => { const U = choice([12, 24, 230]), I = choice([2, 4, 5]), t = choice([2, 3, 5, 10]); return { geg: `W = ${U * I * t},\\; U = ${U},\\; I = ${I}`, erg: t }; } },
    { f: "U = 2(a + b)", nach: "b", rich: "b = \\dfrac{U}{2} - a", falsch: ["b = U - 2a", "b = \\dfrac{U - a}{2}"], werte: () => { const a = randInt(3, 15), b = randInt(2, 15); return { geg: `U = ${2 * (a + b)},\\; a = ${a}`, erg: b }; } },
    { f: "A = \\dfrac{(a + c)\\cdot h}{2}", nach: "h", rich: "h = \\dfrac{2A}{a + c}", falsch: ["h = \\dfrac{A}{2(a + c)}", "h = 2A - (a + c)"], werte: () => { const a = randInt(4, 12), c = randInt(2, 8), h = randInt(2, 10); return { geg: `A = ${((a + c) * h) / 2},\\; a = ${a},\\; c = ${c}`, erg: h }; } },
    { f: "v = \\dfrac{s}{t}", nach: "t", rich: "t = \\dfrac{s}{v}", falsch: ["t = s\\cdot v", "t = \\dfrac{v}{s}"], werte: () => { const v = choice([5, 10, 15, 20, 50, 80]), t = randInt(2, 6); return { geg: `s = ${v * t},\\; v = ${v}`, erg: t }; } },
    { f: "V = \\dfrac{1}{3}\\cdot G\\cdot h", nach: "h", rich: "h = \\dfrac{3V}{G}", falsch: ["h = \\dfrac{V}{3G}", "h = 3V - G"], werte: () => { const G = choice([6, 9, 12, 15, 20]), h = randInt(2, 10); return { geg: `V = ${(G * h) / 3},\\; G = ${G}`, erg: h }; } }
  ];
  function gen_term_10() {
    const F = choice(FORMELN), w = F.werte(), opts = mische([F.rich].concat(F.falsch));
    const txt = (x) => ML_texte(x);
    return { topic: "terme_gleichungen", level: 10, subtype: F.nach, prompt: F.f, promptText: F.f,
      question: `\\text{Stelle nach ${F.nach} um und berechne ${F.nach} für}\\;\\; ${w.geg}`, numFields: 2, fieldLabels: [`umgestellte Formel`, `${F.nach} =`],
      perFieldType: ["choice", "text"], fieldChoices: [opts.map(formelText), null], answer: [formelText(F.rich), w.erg], data: { F: F.f, rich: F.rich, falsch: F.falsch, geg: w.geg, nach: F.nach } };
  }
  // Auswahlknöpfe zeigen Text, keine Formeln -> lesbare Fassung erzeugen
  function formelText(tex) {
    return tex.replace(/\\dfrac\{([^{}]*)\}\{([^{}]*)\}/g, (m, z, n) => `${/[+\-\s]/.test(z) ? "(" + z + ")" : z} / ${/[+\-·\s]/.test(n) || n.length > 1 ? "(" + n + ")" : n}`).replace(/\\cdot/g, "·").replace(/\s+/g, " ").replace(/\( /g, "(").replace(/ \)/g, ")").trim();
  }
  function ML_texte(x) { return x; }
  function check_term_10(task, inp) { const err = []; if (inp[0] !== task.answer[0]) err.push(0); const v = parseUserNumber(inp[1]); if (isNaN(v) || Math.abs(v - task.answer[1]) > 1e-9) err.push(1); return { correct: !err.length, fieldErrors: err }; }

  function prozentstreifenSVG(p, G, W, einheit) {
    const x0 = 20, w = 260, xp = x0 + (w * Math.min(p, 100)) / 100;
    return `<svg viewBox="0 0 300 110" width="300" height="110" xmlns="http://www.w3.org/2000/svg">` +
      `<rect x="${x0}" y="35" width="${w}" height="30" fill="white" stroke="#1e3a8a"/><rect x="${x0}" y="35" width="${(xp - x0).toFixed(1)}" height="30" fill="#93c5fd" stroke="#1e3a8a"/>` +
      `<text x="${x0}" y="25" font-size="12">0 %</text><text x="${(xp - 6).toFixed(1)}" y="25" font-size="12" font-weight="bold" fill="#1e40af">${fmtNum(p)} %</text><text x="${x0 + w - 30}" y="25" font-size="12">100 %</text>` +
      `<text x="${x0}" y="85" font-size="12">0</text><text x="${(xp - 6).toFixed(1)}" y="85" font-size="12" font-weight="bold" fill="#1e40af">W = ${W}</text><text x="${x0 + w - 40}" y="85" font-size="12">G = ${G}</text>` +
      `<text x="${x0}" y="104" font-size="11" fill="#475569">Prozentwert W ist der markierte Teil des Grundwerts G${einheit ? " (" + einheit + ")" : ""}</text></svg>`;
  }
  function kreisdiagrammSVG(teile, ohneWerte) { // teile: [[name, prozent], ...]; Legende unter dem Kreis (handytauglich)
    const farben = ["#60a5fa", "#f59e0b", "#34d399", "#f472b6", "#a78bfa", "#fb7185"], cx = 150, cy = 100, r = 88, H0 = 205;
    let w = -90, svg = `<svg viewBox="0 0 300 ${H0 + teile.length * 22}" width="300" height="${H0 + teile.length * 22}" xmlns="http://www.w3.org/2000/svg">`;
    teile.forEach(([name, p], i) => {
      const w2 = w + (p * 360) / 100, gross = p > 50 ? 1 : 0;
      const P = (g) => [cx + r * Math.cos((g * Math.PI) / 180), cy + r * Math.sin((g * Math.PI) / 180)];
      const [x1, y1] = P(w), [x2, y2] = P(w2);
      svg += `<path d="M ${cx} ${cy} L ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 ${gross} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z" fill="${farben[i % farben.length]}" stroke="white" stroke-width="2"/>`;
      svg += `<rect x="40" y="${H0 - 8 + i * 22}" width="14" height="14" fill="${farben[i % farben.length]}"/><text x="60" y="${H0 + 4 + i * 22}" font-size="13">${ohneWerte ? name : `${name}: ${fmtNum(p)} % ≙ ${fmtNum(roundKfm((p * 360) / 100, 1))}°`}</text>`;
      w = w2;
    });
    return svg + `</svg>`;
  }

  // Säulendiagramm; ymin > 0 erzeugt eine abgeschnittene (irreführende) Achse
  function saeulenSVG(werte, namen, ymin, ymax, schritt, titel) {
    const x0 = 46, y0 = 200, h = 170, w = 240, bw = w / werte.length;
    const py = (v) => y0 - ((v - ymin) / (ymax - ymin)) * h;
    let svg = `<svg viewBox="0 0 300 240" width="300" height="240" xmlns="http://www.w3.org/2000/svg">`;
    for (let v = ymin; v <= ymax + 1e-9; v += schritt) svg += `<line x1="${x0}" y1="${py(v).toFixed(1)}" x2="${x0 + w}" y2="${py(v).toFixed(1)}" stroke="#e2e8f0"/><text x="${x0 - 4}" y="${(py(v) + 4).toFixed(1)}" font-size="10" text-anchor="end">${fmtNum(v)}</text>`;
    werte.forEach((v, i) => {
      svg += `<rect x="${(x0 + i * bw + bw * 0.2).toFixed(1)}" y="${py(v).toFixed(1)}" width="${(bw * 0.6).toFixed(1)}" height="${(y0 - py(v)).toFixed(1)}" fill="#60a5fa" stroke="#1e3a8a"/>`;
      svg += `<text x="${(x0 + i * bw + bw / 2).toFixed(1)}" y="${y0 + 15}" font-size="11" text-anchor="middle">${namen[i]}</text>`;
    });
    svg += `<line x1="${x0}" y1="${y0}" x2="${x0 + w}" y2="${y0}" stroke="#334155"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y0 - h}" stroke="#334155"/>`;
    if (titel) svg += `<text x="150" y="16" font-size="12" font-weight="bold" text-anchor="middle">${titel}</text>`;
    return svg + `</svg>`;
  }

  // ============================================================
  // GEOMETRIE (Kl. 7–10): Winkel, Flächen, Kreis, Pythagoras, Körper

  const f1g = (x) => x.toFixed(1);

  // ---------- Winkel an zwei geschnittenen Parallelen ----------

    const dir = [0, theta, 180, 180 + theta].map((g) => [Math.cos((g * Math.PI) / 180), -Math.sin((g * Math.PI) / 180)]);
    let s = svgKopf(W, H);
    y0.forEach((y) => { s += `<line x1="10" y1="${y}" x2="${W - 10}" y2="${y}" stroke="#1e3a8a" stroke-width="2"/>`; });
    const L = 140; s += `<line x1="${f1g(X[1] - dir[1][0] * L * 1.6)}" y1="${f1g(y0[1] - dir[1][1] * L * 1.6)}" x2="${f1g(X[0] + dir[1][0] * L)}" y2="${f1g(y0[0] + dir[1][1] * L)}" stroke="#1e3a8a" stroke-width="2"/>`;
    s += txt(W - 14, y0[0] - 6, "g", { anchor: "end", size: 12 }) + txt(W - 14, y0[1] - 6, "h", { anchor: "end", size: 12 }) + `<text x="${W - 60}" y="${H - 6}" font-size="11" fill="#475569">g ∥ h</text>`;

  // ---------- Vielecke mit Maßen ----------

  // ---------- Kreis, Kreisring, Kreisausschnitt ----------

      s += m.d ? `<line x1="${cx - R}" y1="${cy}" x2="${cx + R}" y2="${cy}" stroke="#dc2626" stroke-width="2"/>` + txt(cx, cy - 8, m.d, { farbe: "#dc2626" }) : `<line x1="${cx}" y1="${cy}" x2="${cx + R}" y2="${cy}" stroke="#dc2626" stroke-width="2"/>` + txt(cx + R / 2, cy - 8, m.r, { farbe: "#dc2626" }); }

  // ---------- Körper (Schrägbilder) ----------

  // ---- Stufe 1: Winkel an geschnittenen Parallelen ----

  const NACHBAR = { OR: ["OL", "UR"], OL: ["OR", "UL"], UL: ["OL", "UR"], UR: ["OR", "UL"] }, GEGEN = { OR: "UL", UL: "OR", OL: "UR", UR: "OL" };

  }
  function check_geo_1(task, inp) { const err = []; if (inp[0] !== task.answer[0]) err.push(0); const v = parseUserNumber(String(inp[1]).replace("°", "")); if (isNaN(v) || Math.abs(v - task.answer[1]) > 1e-9) err.push(1); return { correct: !err.length, fieldErrors: err }; }

  // ---- Stufe 2: Winkelsummen ----

  function check_geo_tol(task, inp) { const err = []; task.answer.forEach((x, i) => { const v = parseUserNumber(String(inp[i]).replace("°", "").replace(/\s*(cm|m|mm|dm|km|l|ml)(²|³)?$/, "")); const tol = task.tolerances ? task.tolerances[i] : task.tolerance || 1e-9; if (isNaN(v) || Math.abs(v - x) > tol) err.push(i); }); return { correct: !err.length, fieldErrors: err }; }

  // ---- Stufe 3: Flächen und Umfang von Vielecken ----

  // ---------- Glücksrad und Baumdiagramm ----------
  function gluecksradSVG(felder) { // felder: Liste von Beschriftungen (gleich große Sektoren)

      s += `<path d="M ${cx} ${cy} L ${(cx + r * Math.cos(a1)).toFixed(1)} ${(cy + r * Math.sin(a1)).toFixed(1)} A ${r} ${r} 0 0 1 ${(cx + r * Math.cos(a2)).toFixed(1)} ${(cy + r * Math.sin(a2)).toFixed(1)} Z" fill="${farben[i % farben.length]}" stroke="#1e3a8a" stroke-width="1.5"/>`;
      s += `<text x="${(cx + r * 0.65 * Math.cos(am)).toFixed(1)}" y="${(cy + r * 0.65 * Math.sin(am) + 5).toFixed(1)}" font-size="15" font-weight="bold" text-anchor="middle">${f}</text>`;
    });
    return s + `<polygon points="${cx - 7},6 ${cx + 7},6 ${cx},22" fill="#dc2626"/></svg>`;
  }

    const y1 = stufe1.map((_, i) => ((i + 0.5) / stufe1.length) * H);
    stufe1.forEach(([n1, w1], i) => {
      s += `<line x1="${x0}" y1="${H / 2}" x2="${x1 - 12}" y2="${y1[i]}" stroke="#1e3a8a" stroke-width="1.5"/>` + `<text x="${(x0 + x1) / 2 - 8}" y="${((H / 2 + y1[i]) / 2 - 4).toFixed(1)}" font-size="12" fill="#dc2626" font-weight="bold" text-anchor="middle">${w1}</text>`;

        s += `<text x="${x2}" y="${y2 + 5}" font-size="14" font-weight="bold" text-anchor="middle">${n2}</text>`;

  Object.assign(ERKL, {

      [{ left: T("2; 4; 5; 7; 8; 9; 12:  Median 7, q₁ = 4, q₃ = 9, Quartilsabstand 5"), right: "" }], [T("Die Liste nicht ordnen."), T("Quartilsabstand und Spannweite verwechseln.")], "boxplot"),

      [{ left: `${T("Glücksrad im Bild:")}\\;\\; P(1) = \\dfrac{3}{6} = \\dfrac{1}{2}\\,, \\quad P(3) = \\dfrac{1}{6}\\,, \\quad P(${T("nicht 1")}) = 1 - \\dfrac{1}{2} = \\dfrac{1}{2}`, right: "" }], [T("Glücksrad mit ungleich großen Feldern als Laplace-Experiment behandeln."), T("Die Anzahl der Farben statt der Kugeln in den Nenner schreiben.")], "rad"),

  });

    if (art === "baum") return baumSVG([["r", "3/5"], ["b", "2/5"]], [[["r", "2/4"], ["b", "2/4"]], [["r", "3/4"], ["b", "1/4"]]]);

  H.medianUngeordnet = "Den Median erst aus der GEORDNETEN Liste bestimmen.";
  H.tabelleNenner = "Durch die Gesamtzahl aller Werte teilen (Summe der Anzahlen), nicht durch die Anzahl der Spalten.";
